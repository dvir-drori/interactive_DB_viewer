<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIR Lab - Transplant Patient Timeline</title>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.0/plotly.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    /* ── Top bar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-wrap: wrap;
    }

    #toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #64b5f6;
      white-space: nowrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-group label {
      font-size: 13px;
      color: #90a4ae;
    }

    select, button {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #1a1a2e;
      color: #e0e0e0;
      cursor: pointer;
    }

    select:hover, button:hover {
      border-color: #64b5f6;
    }

    button {
      background: #0f3460;
    }

    button:hover {
      background: #1a5276;
    }

    #patient-info {
      font-size: 12px;
      color: #78909c;
      margin-left: auto;
    }

    /* ── Track selector panel ── */
    #track-panel {
      padding: 8px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #track-panel label.section-label {
      font-size: 12px;
      color: #64b5f6;
      font-weight: 600;
      margin-right: 4px;
    }

    .track-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .track-chip:hover {
      border-color: #64b5f6;
    }

    .track-chip.active {
      background: #0f3460;
      border-color: #64b5f6;
      color: #fff;
    }

    .track-chip input { display: none; }

    .track-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .track-actions button {
      font-size: 11px;
      padding: 3px 8px;
    }

    /* ── Chart container ── */
    #chart-container {
      margin: 0;
      min-height: 300px;
    }

    /* ── Loading state ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      font-size: 14px;
      color: #78909c;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>NIR Lab &middot; Transplant Timeline</h1>

  <div class="toolbar-group">
    <label for="patient-select">Patient:</label>
    <select id="patient-select"></select>
  </div>

  <span id="patient-info">Use scroll to zoom, drag to pan</span>
</div>

<div id="track-panel">
  <label class="section-label">Tracks:</label>
  <!-- chips injected by JS -->
  <div class="track-actions">
    <button id="btn-all-tracks">All</button>
    <button id="btn-no-tracks">None</button>
    <button id="btn-clinical-tracks">Clinical</button>
  </div>
</div>

<div id="loading">Loading patient data...</div>
<div id="chart-container"></div>

<script>
(function () {
  "use strict";

  // ── Color palette (matching TimelineChart.jsx) ──
  var LAB_COLORS = [
    '#4f8ef7','#f59e0b','#10b981','#ef4444','#8b5cf6',
    '#06b6d4','#f97316','#84cc16','#ec4899','#14b8a6',
    '#a78bfa','#fb923c','#34d399','#f472b6','#60a5fa'
  ];

  function colorForIndex(i) {
    return LAB_COLORS[i % LAB_COLORS.length];
  }

  // ── Track definitions ──
  var TRACKS = [
    { name: "ALT",         file: "ALANINE.AM.TRAN (ALT).bedGraph", group: "clinical" },
    { name: "ALBUMIN",     file: "ALBUMIN.bedGraph",               group: "clinical" },
    { name: "ALK. PHOS.",  file: "ALK. PHOS..bedGraph",            group: "clinical" },
    { name: "AST",         file: "ASPART.AM.TRANS (AST).bedGraph", group: "clinical" },
    { name: "BILE ACIDS",  file: "BILE ACIDS.bedGraph",            group: "clinical" },
    { name: "CMV-PCR",     file: "CMV-PCR.bedGraph",               group: "clinical" },
    { name: "CREATININE",  file: "CREATININE.bedGraph",            group: "clinical" },
    { name: "DIASTASE",    file: "DIASTASE.bedGraph",              group: "clinical" },
    { name: "EBV-PCR",     file: "EBV-PCR.bedGraph",               group: "clinical" },
    { name: "GGTP",        file: "GGTP.bedGraph",                  group: "clinical" },
    { name: "GLUCOSE",     file: "GLUCOSE.bedGraph",               group: "clinical" },
    { name: "HGB",         file: "HGB.bedGraph",                   group: "clinical" },
    { name: "INR",         file: "INR.bedGraph",                   group: "clinical" },
    { name: "LDH",         file: "LDH.bedGraph",                   group: "clinical" },
    { name: "LYMPHOCYTE",  file: "LYMPHOCYTE.bedGraph",            group: "clinical" },
    { name: "NEUTROPHILE", file: "NEUTROPHILE.bedGraph",           group: "clinical" },
    { name: "PLATELETS",   file: "PLATELETS.bedGraph",             group: "clinical" },
    { name: "POTASSIUM",   file: "POTASSIUM.bedGraph",             group: "clinical" },
    { name: "SODIUM",      file: "SODIUM.bedGraph",                group: "clinical" },
    { name: "T.BILIRUBIN", file: "T.BILIRUBIN.bedGraph",           group: "clinical" },
    { name: "UREA",        file: "UREA.bedGraph",                  group: "clinical" },
    { name: "WBC",         file: "WBC.bedGraph",                   group: "clinical" },
    { name: "Biopsy",      file: "Biopsy_value-0.1_number-1_of_1.bedGraph", group: "event" },
    { name: "H3K4me3 (1/3)", file: "H3K4me3_value-1_number-1_of_3.bedGraph",   group: "epigenetic" },
    { name: "H3K4me3 (2/3)", file: "H3K4me3_value-2_number-2_of_3.bedGraph",   group: "epigenetic" },
    { name: "H3K4me3 (3/3)", file: "H3K4me3_value-0.1_number-3_of_3.bedGraph", group: "epigenetic" },
  ];

  var DEFAULT_TRACKS = new Set([
    "ALT", "AST", "CREATININE", "WBC", "HGB", "PLATELETS"
  ]);

  // ── State ──
  var patients = [];            // [{id, len}, ...]
  var selectedPatient = null;
  var enabledTracks = new Set(DEFAULT_TRACKS);
  var bedGraphCache = {};       // file -> [{patientId, day, value}, ...]
  var rendering = false;

  // ── Parse patients.fasta.fai ──
  async function loadPatientList() {
    var resp = await fetch("patients.fasta.fai");
    var text = await resp.text();
    patients = text.trim().split("\n").map(function (line) {
      var cols = line.split("\t");
      return { id: cols[0], len: parseInt(cols[1], 10) };
    });
    patients.sort(function (a, b) { return a.id.localeCompare(b.id); });

    var sel = document.getElementById("patient-select");
    patients.forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.id + " (" + p.len + " days)";
      sel.appendChild(opt);
    });

    document.getElementById("patient-info").textContent =
      patients.length + " patients | scroll to zoom, drag to pan";

    selectedPatient = patients[0].id;
  }

  // ── bedGraph fetcher + parser ──
  async function fetchBedGraph(file) {
    if (bedGraphCache[file]) return bedGraphCache[file];

    var resp = await fetch("bedgraphs_by_label/" + file);
    var text = await resp.text();
    var rows = [];
    var lines = text.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line.startsWith("track")) continue;
      var cols = line.split("\t");
      if (cols.length < 4) continue;
      rows.push({
        patientId: cols[0],
        day: parseInt(cols[2], 10),
        value: parseFloat(cols[3])
      });
    }
    bedGraphCache[file] = rows;
    return rows;
  }

  function filterForPatient(rows, patientId) {
    return rows
      .filter(function (r) { return r.patientId === patientId; })
      .sort(function (a, b) { return a.day - b.day; });
  }

  // ── Build track chip UI ──
  function buildTrackChips() {
    var panel = document.getElementById("track-panel");
    var ref = panel.querySelector(".track-actions");

    TRACKS.forEach(function (t) {
      var chip = document.createElement("label");
      chip.className = "track-chip" + (enabledTracks.has(t.name) ? " active" : "");
      chip.setAttribute("data-track", t.name);
      chip.innerHTML = '<input type="checkbox"' +
        (enabledTracks.has(t.name) ? " checked" : "") + '>' + t.name;

      chip.addEventListener("click", function () {
        setTimeout(function () {
          var checked = chip.querySelector("input").checked;
          if (checked) {
            enabledTracks.add(t.name);
            chip.classList.add("active");
          } else {
            enabledTracks.delete(t.name);
            chip.classList.remove("active");
          }
          renderChart();
        }, 0);
      });

      panel.insertBefore(chip, ref);
    });

    document.getElementById("btn-all-tracks").addEventListener("click", function () {
      setAllTracks(true);
    });
    document.getElementById("btn-no-tracks").addEventListener("click", function () {
      setAllTracks(false);
    });
    document.getElementById("btn-clinical-tracks").addEventListener("click", function () {
      TRACKS.forEach(function (t) {
        var want = t.group === "clinical";
        if (want) enabledTracks.add(t.name);
        else enabledTracks.delete(t.name);
      });
      updateChipUI();
      renderChart();
    });
  }

  function setAllTracks(on) {
    TRACKS.forEach(function (t) {
      if (on) enabledTracks.add(t.name);
      else enabledTracks.delete(t.name);
    });
    updateChipUI();
    renderChart();
  }

  function updateChipUI() {
    document.querySelectorAll(".track-chip").forEach(function (chip) {
      var input = chip.querySelector("input");
      var trackName = chip.getAttribute("data-track");
      var isActive = enabledTracks.has(trackName);
      input.checked = isActive;
      chip.classList.toggle("active", isActive);
    });
  }

  // ── Render Plotly chart ──
  async function renderChart() {
    if (rendering) return;
    rendering = true;

    var container = document.getElementById("chart-container");
    var loadingEl = document.getElementById("loading");

    if (!selectedPatient) {
      container.innerHTML = "";
      loadingEl.style.display = "flex";
      loadingEl.textContent = "Select a patient";
      rendering = false;
      return;
    }

    // Find patient total days
    var patientObj = null;
    for (var pi = 0; pi < patients.length; pi++) {
      if (patients[pi].id === selectedPatient) { patientObj = patients[pi]; break; }
    }
    var totalDays = patientObj ? patientObj.len : 400;

    // Determine which tracks are enabled
    var labTracks = [];
    var eventTracks = [];
    TRACKS.forEach(function (t) {
      if (!enabledTracks.has(t.name)) return;
      if (t.group === "event") eventTracks.push(t);
      else labTracks.push(t);
    });

    if (labTracks.length === 0 && eventTracks.length === 0) {
      Plotly.purge(container);
      loadingEl.style.display = "flex";
      loadingEl.textContent = "Enable tracks to view data";
      rendering = false;
      return;
    }

    loadingEl.style.display = "flex";
    loadingEl.textContent = "Loading tracks...";

    // Fetch all needed bedGraph files in parallel
    var allNeeded = labTracks.concat(eventTracks);
    var fetchPromises = allNeeded.map(function (t) { return fetchBedGraph(t.file); });

    try {
      await Promise.all(fetchPromises);
    } catch (e) {
      loadingEl.textContent = "Error loading data: " + e.message;
      rendering = false;
      return;
    }

    // Build traces and layout
    var nLab = labTracks.length;
    var hasEvents = eventTracks.length > 0;
    var nRows = nLab + (hasEvents ? 1 : 0);

    if (nRows === 0) {
      rendering = false;
      return;
    }

    var traces = [];
    var layoutYAxes = {};

    // Compute y-axis domain fractions (top to bottom: lab tracks, then events at bottom)
    var step = 1 / nRows;

    // Lab tracks (top to bottom, index 0 at top)
    labTracks.forEach(function (t, i) {
      var rows = bedGraphCache[t.file] || [];
      var pts = filterForPatient(rows, selectedPatient);

      var axisIndex = i + 1;
      var axisName = axisIndex === 1 ? "y" : "y" + axisIndex;
      var axisKey = axisIndex === 1 ? "yaxis" : "yaxis" + axisIndex;

      // Domain: from top, lab track i occupies row i
      var top = 1 - i * step;
      var bottom = 1 - (i + 1) * step;
      if (hasEvents) {
        // Reserve bottom row for events
        var labStep = (1 - step) / nLab;
        top = 1 - i * labStep;
        bottom = 1 - (i + 1) * labStep;
      }

      traces.push({
        type: "scatter",
        mode: "lines+markers",
        name: t.name,
        x: pts.map(function (p) { return p.day; }),
        y: pts.map(function (p) { return p.value; }),
        line: { color: colorForIndex(i), width: 1.5 },
        marker: { size: 5, color: colorForIndex(i) },
        hovertemplate: "<b>" + t.name + "</b><br>Day %{x}<br>Value: %{y:.2f}<extra></extra>",
        xaxis: "x",
        yaxis: axisName,
      });

      layoutYAxes[axisKey] = {
        domain: [bottom + 0.01, top - 0.01],
        title: { text: t.name, font: { size: 10, color: "#9ca3af" }, standoff: 4 },
        color: "#9ca3af",
        gridcolor: "#2a2d3e",
        tickfont: { size: 9, color: "#9ca3af" },
        zeroline: false,
      };
    });

    // Events track (bottom row)
    if (hasEvents) {
      var evtAxisIndex = nLab + 1;
      var evtAxisName = evtAxisIndex === 1 ? "y" : "y" + evtAxisIndex;
      var evtAxisKey = evtAxisIndex === 1 ? "yaxis" : "yaxis" + evtAxisIndex;

      eventTracks.forEach(function (t) {
        var rows = bedGraphCache[t.file] || [];
        var pts = filterForPatient(rows, selectedPatient);

        traces.push({
          type: "scatter",
          mode: "markers",
          name: t.name,
          x: pts.map(function (p) { return p.day; }),
          y: pts.map(function () { return t.name; }),
          marker: {
            size: 10,
            color: "#f59e0b",
            symbol: "diamond",
            line: { width: 1, color: "#fff" }
          },
          hovertemplate: "<b>" + t.name + "</b><br>Day %{x}<extra></extra>",
          xaxis: "x",
          yaxis: evtAxisName,
        });
      });

      layoutYAxes[evtAxisKey] = {
        domain: [0, step - 0.01],
        color: "#9ca3af",
        gridcolor: "#2a2d3e",
        tickfont: { size: 9, color: "#9ca3af" },
        zeroline: false,
      };
    }

    // Compute chart height
    var chartHeight = nLab * 150 + (hasEvents ? 100 : 0) + 60;

    var layout = {
      height: chartHeight,
      paper_bgcolor: "transparent",
      plot_bgcolor: "transparent",
      showlegend: false,
      margin: { t: 10, b: 50, l: 90, r: 20 },
      xaxis: {
        title: { text: "Day since transplant", font: { size: 11, color: "#9ca3af" } },
        color: "#9ca3af",
        gridcolor: "#2a2d3e",
        range: [0, totalDays + 5],
        tickfont: { size: 10, color: "#9ca3af" },
      },
      font: { color: "#9ca3af", size: 11 },
    };

    // Merge y-axes into layout
    var keys = Object.keys(layoutYAxes);
    for (var k = 0; k < keys.length; k++) {
      layout[keys[k]] = layoutYAxes[keys[k]];
    }

    loadingEl.style.display = "none";

    Plotly.react(container, traces, layout, {
      responsive: true,
      displayModeBar: true,
      scrollZoom: true,
    });

    rendering = false;
  }

  // ── Patient navigation ──
  function setupNavigation() {
    document.getElementById("patient-select").addEventListener("change", function () {
      selectedPatient = this.value;
      renderChart();
    });
  }

  // ── Boot ──
  async function main() {
    await loadPatientList();
    buildTrackChips();
    setupNavigation();
    await renderChart();
  }

  main();
})();
</script>

</body>
</html>
