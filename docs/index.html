      marker: {
        size: 12,
        color: "#f59e0b",
        symbol: "diamond",
        line: { width: 1.5, color: "#fff" }
      },
      xaxis: xAxis,
      yaxis: yAxis,
      showlegend: false
    };
  }

  // ═══════════════════════════════════════════════════════
  // CORRELATION INSIGHTS
  // ═══════════════════════════════════════════════════════
  function dedupeByDay(pts) {
    // pts sorted by day; average values sharing the same day
    var out = [];
    var i = 0;
    while (i < pts.length) {
      var day = pts[i].day, sum = 0, cnt = 0;
      while (i < pts.length && pts[i].day === day) { sum += pts[i].value; cnt++; i++; }
      out.push({ day: day, value: sum / cnt });
    }
    return out;
  }

  function interpAt(pts, day) {
    // linear interpolation; pts sorted, day within [first,last]
    if (day <= pts[0].day) return pts[0].value;
    var last = pts[pts.length - 1];
    if (day >= last.day) return last.value;
    for (var i = 1; i < pts.length; i++) {
      if (pts[i].day >= day) {
        var a = pts[i - 1], b = pts[i];
        var frac = (day - a.day) / (b.day - a.day);
        return a.value + frac * (b.value - a.value);
      }
    }
    return last.value;
  }

  function pearson(xs, ys) {
    var n = xs.length, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
    for (var i = 0; i < n; i++) {
      sx += xs[i]; sy += ys[i];
      sxx += xs[i] * xs[i]; syy += ys[i] * ys[i]; sxy += xs[i] * ys[i];
    }
    var num = n * sxy - sx * sy;
    var den = Math.sqrt((n * sxx - sx * sx) * (n * syy - sy * sy));
    if (den === 0) return null;
    return num / den;
  }

  function toRanks(arr) {
    var idx = arr.map(function (v, i) { return [v, i]; });
    idx.sort(function (a, b) { return a[0] - b[0]; });
    var ranks = new Array(arr.length);
    var i = 0;
    while (i < idx.length) {
      var j = i;
      while (j < idx.length && idx[j][0] === idx[i][0]) j++;
      var avgRank = (i + j - 1) / 2 + 1; // average rank for ties
      for (var k = i; k < j; k++) ranks[idx[k][1]] = avgRank;
      i = j;
    }
    return ranks;
  }

  // Build the per-patient series for every continuous track that has data.
  function collectPatientSeries() {
    var refDate = getPatient(state.selectedPatientId) ? getPatient(state.selectedPatientId).referenceDate : null;
    var series = [];
    getAllTracks().forEach(function (t) {
      var catType = "continuous";
      if (state.config && state.config.categories[t.track.category]) {
        catType = state.config.categories[t.track.category].type;
      }
      if (catType === "event") return;
      var pts = getTrackData(t, refDate); // respects current date-range filter
      if (!pts || pts.length < 2) return;
      var clean = dedupeByDay(pts.slice().sort(function (a, b) { return a.day - b.day; }));
      if (clean.length < 2) return;
      series.push({
        idx: t.idx,
        name: getTrackName(t.idx, t.track),
        unit: t.track.unit || "",
        pts: clean,
        minDay: clean[0].day,
        maxDay: clean[clean.length - 1].day
      });
    });
    return series;
  }

  function correlatePair(A, B, method, minN) {
    var lo = Math.max(A.minDay, B.minDay);
    var hi = Math.min(A.maxDay, B.maxDay);
    if (hi <= lo) return null;
    // sample at the union of real measurement days inside the overlap
    var daySet = {};
    A.pts.forEach(function (p) { if (p.day >= lo && p.day <= hi) daySet[p.day] = 1; });
    B.pts.forEach(function (p) { if (p.day >= lo && p.day <= hi) daySet[p.day] = 1; });
    var days = Object.keys(daySet).map(Number).sort(function (a, b) { return a - b; });
    if (days.length < minN) return null;
    var xs = days.map(function (d) { return interpAt(A.pts, d); });
    var ys = days.map(function (d) { return interpAt(B.pts, d); });
    if (method === "spearman") { xs = toRanks(xs); ys = toRanks(ys); }
    var r = pearson(xs, ys);
    if (r === null) return null;
    return { r: r, n: days.length };
  }

  function openInsights() {
    if (!state.selectedPatientId) { showToast("Select a patient first"); return; }
    $("insights-patient").textContent = "· " + state.selectedPatientId;
    $("insights-overlay").classList.add("open");
    renderInsights();
  }

  function closeInsights() {
    $("insights-overlay").classList.remove("open");
    try { Plotly.purge($("insights-heatmap")); } catch (e) {}
  }

  function renderInsights() {
    var method = $("insights-method").value;
    var minN = parseInt($("insights-minn").value, 10) || 8;
    var series = collectPatientSeries();
    var heatEl = $("insights-heatmap");
    var rankEl = $("insights-ranked");

    if (series.length < 2) {
      try { Plotly.purge(heatEl); } catch (e) {}
      heatEl.innerHTML = "";
      rankEl.innerHTML = "<div class='insights-empty'>This patient has fewer than two tracks with enough data to correlate. Enable more tracks or pick another patient.</div>";
      return;
    }

    var names = series.map(function (s) { return s.name; });
    var N = series.length;
    var matrix = [];        // rows for heatmap (r values or null)
    var pairs = [];         // flat list for ranking
    for (var i = 0; i < N; i++) {
      matrix.push(new Array(N).fill(null));
    }
    for (var a = 0; a < N; a++) {
      matrix[a][a] = 1;
      for (var b = a + 1; b < N; b++) {
        var res = correlatePair(series[a], series[b], method, minN);
        if (res) {
          matrix[a][b] = res.r;
          matrix[b][a] = res.r;
          pairs.push({ a: names[a], b: names[b], r: res.r, n: res.n });
        }
      }
    }

    // Heatmap
    var fontColor = getComputedStyle(document.body).getPropertyValue('--plotly-font-color').trim() || "#9ca3af";
    var heatText = matrix.map(function (row) {
      return row.map(function (v) { return v === null ? "" : v.toFixed(2); });
    });
    var heatData = [{
      type: "heatmap",
      z: matrix, x: names, y: names, text: heatText,
      texttemplate: "%{text}", textfont: { size: 9 },
      hovertemplate: "%{y} ↔ %{x}<br>r = %{z:.2f}<extra></extra>",
      zmin: -1, zmax: 1, zmid: 0,
      colorscale: [[0, "#ef4444"], [0.5, "#1a1d27"], [1, "#10b981"]],
      xgap: 1, ygap: 1,
      colorbar: { title: { text: "r", side: "right" }, thickness: 10, len: 0.8, tickfont: { size: 9, color: fontColor } }
    }];
    var cell = 30;
    var heatLayout = {
      paper_bgcolor: "transparent", plot_bgcolor: "transparent",
      margin: { t: 10, r: 10, b: 120, l: 120 },
      height: Math.max(220, N * cell + 140),
      font: { family: "'IBM Plex Mono', monospace", color: fontColor, size: 9 },
      xaxis: { tickangle: -45, automargin: true, side: "bottom", tickfont: { size: 9, color: fontColor } },
      yaxis: { automargin: true, autorange: "reversed", tickfont: { size: 9, color: fontColor } }
    };
    Plotly.purge(heatEl);
    Plotly.newPlot(heatEl, heatData, heatLayout, { displayModeBar: false, responsive: true });

    // Ranked lists
    rankEl.innerHTML = "";
    if (pairs.length === 0) {
      rankEl.innerHTML = "<div class='insights-empty'>No track pairs share at least " + minN + " overlapping measurement days. Lower the minimum overlap or widen the date range.</div>";
      return;
    }
    var sorted = pairs.slice().sort(function (x, y) { return y.r - x.r; });
    var pos = sorted.filter(function (p) { return p.r > 0; }).slice(0, 12);
    var neg = sorted.filter(function (p) { return p.r < 0; }).sort(function (x, y) { return x.r - y.r; }).slice(0, 12);

    rankEl.appendChild(buildRankBlock("Strongest positive correlations", pos, "rank-pos"));
    rankEl.appendChild(buildRankBlock("Strongest negative correlations", neg, "rank-neg"));
  }

  function buildRankBlock(title, list, cls) {
    var block = document.createElement("div");
    block.className = "rank-block";
    var h = document.createElement("h3");
    h.textContent = title;
    block.appendChild(h);
    if (list.length === 0) {
      var e = document.createElement("div");
      e.className = "insights-empty";
      e.textContent = "None found.";
      block.appendChild(e);
      return block;
    }
    var head = document.createElement("div");
    head.className = "rank-row";
    head.innerHTML = "<span class='rr-pair' style='color:var(--color-text-muted)'>Pair</span>" +
      "<span class='rr-r' style='color:var(--color-text-muted)'>r</span>" +
      "<span class='rr-n' style='color:var(--color-text-muted)'>n</span>";
    block.appendChild(head);
    list.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "rank-row";
      var pair = document.createElement("span");
      pair.className = "rr-pair";
      pair.textContent = p.a + "  ↔  " + p.b;
      var r = document.createElement("span");
      r.className = "rr-r " + cls;
      r.textContent = (p.r > 0 ? "+" : "") + p.r.toFixed(2);
      var n = document.createElement("span");
      n.className = "rr-n";
      n.textContent = p.n;
      row.appendChild(pair); row.appendChild(r); row.appendChild(n);
      block.appendChild(row);
    });
    return block;
  }

  // ═══════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════
  async function main() {
    try {
      await loadConfig();
    } catch (e) {
      $("loading").innerHTML = "Failed to load config.json — " + e.message;
      return;
    }

    var restored = restoreSession();
    initState();
    applyTheme();

    populatePatientDropdown();
    updatePatientInfo();
    updateToolbarState();
    setupToolbarHandlers();
    setupPatientSearch();
    setupDropZone();

    // Pre-fetch all bedGraph files so sidebar knows which tracks have data
    $("loading").innerHTML = "<span class='spinner'></span> Loading track data...";
    try {
      await loadAllBedGraphs();
    } catch (e) {
      console.warn("Some bedGraph files failed to load:", e);
    }

    rebuildSidebar();

    if (restored) {
      showToast("Session restored");
    }

    try {
      await renderChart();
    } catch(e) {
      console.error("[renderChart] error:", e);
      $("loading").style.display = "flex";
      $("loading").innerHTML = "Render error: " + e.message;
    }
  }

  main();
})();
</script>

</body>
