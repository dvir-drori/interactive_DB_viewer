<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIR Lab - Transplant Patient Timeline</title>
  <script src="https://cdn.jsdelivr.net/npm/igv@3.1.1/dist/igv.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    /* ── Top bar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-wrap: wrap;
    }

    #toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #64b5f6;
      white-space: nowrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-group label {
      font-size: 13px;
      color: #90a4ae;
    }

    select, button {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #1a1a2e;
      color: #e0e0e0;
      cursor: pointer;
    }

    select:hover, button:hover {
      border-color: #64b5f6;
    }

    button {
      background: #0f3460;
    }

    button:hover {
      background: #1a5276;
    }

    #patient-info {
      font-size: 12px;
      color: #78909c;
      margin-left: auto;
    }

    /* ── Track selector panel ── */
    #track-panel {
      padding: 8px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #track-panel label.section-label {
      font-size: 12px;
      color: #64b5f6;
      font-weight: 600;
      margin-right: 4px;
    }

    .track-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .track-chip:hover {
      border-color: #64b5f6;
    }

    .track-chip.active {
      background: #0f3460;
      border-color: #64b5f6;
      color: #fff;
    }

    .track-chip input { display: none; }

    .track-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .track-actions button {
      font-size: 11px;
      padding: 3px 8px;
    }

    /* ── IGV container ── */
    #igv-container {
      margin: 0;
    }

    /* ── Loading state ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      font-size: 14px;
      color: #78909c;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>NIR Lab &middot; Transplant Timeline</h1>

  <div class="toolbar-group">
    <label for="patient-select">Patient:</label>
    <select id="patient-select">
      <option value="all">All patients (overview)</option>
    </select>
  </div>

  <div class="toolbar-group">
    <button id="btn-zoom-in" title="Zoom in">+ Zoom</button>
    <button id="btn-zoom-out" title="Zoom out">- Zoom</button>
  </div>

  <span id="patient-info"></span>
</div>

<div id="track-panel">
  <label class="section-label">Tracks:</label>
  <!-- chips injected by JS -->
  <div class="track-actions">
    <button id="btn-all-tracks">All</button>
    <button id="btn-no-tracks">None</button>
    <button id="btn-clinical-tracks">Clinical</button>
  </div>
</div>

<div id="loading">Loading IGV browser...</div>
<div id="igv-container"></div>

<script>
(function () {
  "use strict";

  // ── Track definitions ──
  // Clinical lab tracks (bedGraph files in bedgraphs_by_label/)
  const TRACKS = [
    { name: "ALT",         file: "ALANINE.AM.TRAN (ALT).bedGraph", group: "clinical" },
    { name: "ALBUMIN",     file: "ALBUMIN.bedGraph",               group: "clinical" },
    { name: "ALK. PHOS.",  file: "ALK. PHOS..bedGraph",            group: "clinical" },
    { name: "AST",         file: "ASPART.AM.TRANS (AST).bedGraph", group: "clinical" },
    { name: "BILE ACIDS",  file: "BILE ACIDS.bedGraph",            group: "clinical" },
    { name: "CMV-PCR",     file: "CMV-PCR.bedGraph",               group: "clinical" },
    { name: "CREATININE",  file: "CREATININE.bedGraph",            group: "clinical" },
    { name: "DIASTASE",    file: "DIASTASE.bedGraph",              group: "clinical" },
    { name: "EBV-PCR",     file: "EBV-PCR.bedGraph",               group: "clinical" },
    { name: "GGTP",        file: "GGTP.bedGraph",                  group: "clinical" },
    { name: "GLUCOSE",     file: "GLUCOSE.bedGraph",               group: "clinical" },
    { name: "HGB",         file: "HGB.bedGraph",                   group: "clinical" },
    { name: "INR",         file: "INR.bedGraph",                   group: "clinical" },
    { name: "LDH",         file: "LDH.bedGraph",                   group: "clinical" },
    { name: "LYMPHOCYTE",  file: "LYMPHOCYTE.bedGraph",            group: "clinical" },
    { name: "NEUTROPHILE", file: "NEUTROPHILE.bedGraph",           group: "clinical" },
    { name: "PLATELETS",   file: "PLATELETS.bedGraph",             group: "clinical" },
    { name: "POTASSIUM",   file: "POTASSIUM.bedGraph",             group: "clinical" },
    { name: "SODIUM",      file: "SODIUM.bedGraph",                group: "clinical" },
    { name: "T.BILIRUBIN", file: "T.BILIRUBIN.bedGraph",           group: "clinical" },
    { name: "UREA",        file: "UREA.bedGraph",                  group: "clinical" },
    { name: "WBC",         file: "WBC.bedGraph",                   group: "clinical" },
    { name: "Biopsy",      file: "Biopsy_value-0.1_number-1_of_1.bedGraph", group: "event" },
    { name: "H3K4me3 (1/3)", file: "H3K4me3_value-1_number-1_of_3.bedGraph",   group: "epigenetic" },
    { name: "H3K4me3 (2/3)", file: "H3K4me3_value-2_number-2_of_3.bedGraph",   group: "epigenetic" },
    { name: "H3K4me3 (3/3)", file: "H3K4me3_value-0.1_number-3_of_3.bedGraph", group: "epigenetic" },
  ];

  // Default tracks to show on load (key clinical ones)
  const DEFAULT_TRACKS = new Set([
    "ALT", "AST", "CREATININE", "WBC", "HGB", "PLATELETS"
  ]);

  // ── State ──
  let browser = null;
  let patients = [];         // [{id: "TRN0001", len: 2067}, ...]
  let activeTracks = {};     // name -> igv track object
  let enabledTracks = new Set(DEFAULT_TRACKS);

  // ── Parse patients.fasta.fai ──
  async function loadPatientList() {
    const resp = await fetch("patients.fasta.fai");
    const text = await resp.text();
    patients = text.trim().split("\n").map(function (line) {
      const cols = line.split("\t");
      return { id: cols[0], len: parseInt(cols[1], 10) };
    });
    // Sort by ID
    patients.sort(function (a, b) { return a.id.localeCompare(b.id); });

    // Populate dropdown
    const sel = document.getElementById("patient-select");
    patients.forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.id + " (" + p.len + " days)";
      sel.appendChild(opt);
    });

    document.getElementById("patient-info").textContent =
      patients.length + " patients loaded";
  }

  // ── Build track chip UI ──
  function buildTrackChips() {
    var panel = document.getElementById("track-panel");
    var ref = panel.querySelector(".track-actions");

    TRACKS.forEach(function (t) {
      var chip = document.createElement("label");
      chip.className = "track-chip" + (enabledTracks.has(t.name) ? " active" : "");
      chip.innerHTML = '<input type="checkbox"' +
        (enabledTracks.has(t.name) ? " checked" : "") + '>' + t.name;

      chip.addEventListener("click", function (e) {
        // Toggle happens on the input; we read it after
        setTimeout(function () {
          var checked = chip.querySelector("input").checked;
          if (checked) {
            enabledTracks.add(t.name);
            chip.classList.add("active");
            addTrack(t);
          } else {
            enabledTracks.delete(t.name);
            chip.classList.remove("active");
            removeTrack(t.name);
          }
        }, 0);
      });

      panel.insertBefore(chip, ref);
    });

    // Bulk actions
    document.getElementById("btn-all-tracks").addEventListener("click", function () {
      setAllTracks(true);
    });
    document.getElementById("btn-no-tracks").addEventListener("click", function () {
      setAllTracks(false);
    });
    document.getElementById("btn-clinical-tracks").addEventListener("click", function () {
      TRACKS.forEach(function (t) {
        var want = t.group === "clinical";
        var has = enabledTracks.has(t.name);
        if (want && !has) {
          enabledTracks.add(t.name);
          addTrack(t);
        } else if (!want && has) {
          enabledTracks.delete(t.name);
          removeTrack(t.name);
        }
      });
      updateChipUI();
    });
  }

  function setAllTracks(on) {
    TRACKS.forEach(function (t) {
      if (on && !enabledTracks.has(t.name)) {
        enabledTracks.add(t.name);
        addTrack(t);
      } else if (!on && enabledTracks.has(t.name)) {
        enabledTracks.delete(t.name);
        removeTrack(t.name);
      }
    });
    updateChipUI();
  }

  function updateChipUI() {
    document.querySelectorAll(".track-chip").forEach(function (chip) {
      var input = chip.querySelector("input");
      var name = chip.textContent;
      var isActive = false;
      TRACKS.forEach(function (t) {
        if (t.name === name) isActive = enabledTracks.has(t.name);
      });
      input.checked = isActive;
      chip.classList.toggle("active", isActive);
    });
  }

  // ── IGV track management ──
  function makeTrackConfig(t) {
    return {
      name: t.name,
      url: "bedgraphs_by_label/" + t.file,
      format: "bedgraph",
      autoscale: true,
      _trackKey: t.name
    };
  }

  function addTrack(t) {
    if (!browser || activeTracks[t.name]) return;
    var cfg = makeTrackConfig(t);
    browser.loadTrack(cfg).then(function (track) {
      activeTracks[t.name] = track;
    });
  }

  function removeTrack(name) {
    if (!browser || !activeTracks[name]) return;
    browser.removeTrack(activeTracks[name]);
    delete activeTracks[name];
  }

  // ── Initialize IGV ──
  async function initBrowser() {
    // Build initial track configs
    var initialTracks = [];
    TRACKS.forEach(function (t) {
      if (enabledTracks.has(t.name)) {
        initialTracks.push(makeTrackConfig(t));
      }
    });

    // Add annotations track
    initialTracks.push({
      name: "Annotations",
      url: "annotations.gff",
      format: "gff",
      color: "#4caf50",
      displayMode: "EXPANDED",
      _trackKey: "__annotations__"
    });

    var options = {
      genome: {
        id: "patients",
        name: "Patients",
        fastaURL: "patients.fasta",
        indexURL: "patients.fasta.fai"
      },
      locus: "all",
      showChromosomeWidget: true,
      tracks: initialTracks
    };

    document.getElementById("loading").style.display = "none";

    browser = await igv.createBrowser(
      document.getElementById("igv-container"),
      options
    );

    // Store references to loaded tracks
    if (browser.trackViews) {
      browser.trackViews.forEach(function (tv) {
        if (tv.track && tv.track.config && tv.track.config._trackKey) {
          activeTracks[tv.track.config._trackKey] = tv.track;
        }
      });
    }
  }

  // ── Patient navigation ──
  function setupNavigation() {
    document.getElementById("patient-select").addEventListener("change", function () {
      if (!browser) return;
      var val = this.value;
      if (val === "all") {
        browser.search("all");
      } else {
        browser.search(val);
      }
    });

    document.getElementById("btn-zoom-in").addEventListener("click", function () {
      if (browser) browser.zoomIn();
    });

    document.getElementById("btn-zoom-out").addEventListener("click", function () {
      if (browser) browser.zoomOut();
    });
  }

  // ── Boot ──
  async function main() {
    await loadPatientList();
    buildTrackChips();
    setupNavigation();
    await initBrowser();
  }

  main();
})();
</script>

</body>
</html>
