<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIR Lab — Patient Timeline Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.0/plotly.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── CSS Variables — Dark (default) ── */
    :root {
      --color-bg: #0b0f19;
      --color-panel: #111827;
      --color-panel-alt: #1a1d27;
      --color-border: #2a2d3e;
      --color-accent: #38bdf8;
      --color-text: #e0e0e0;
      --color-text-muted: #9ca3af;
      --color-biopsy: #f59e0b;
      --color-epigenetic: #7c3aed;
      --color-success: #10b981;
      --color-error: #ef4444;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-heading: 'Syne', sans-serif;
      --sidebar-width: 280px;
      --plotly-font-color: #9ca3af;
      --plotly-grid-color: #1e2130;
      --plotly-bg: transparent;
    }

    /* ── Light Theme ── */
    body.light {
      --color-bg: #f5f7fa;
      --color-panel: #ffffff;
      --color-panel-alt: #f0f1f4;
      --color-border: #d1d5db;
      --color-accent: #2563eb;
      --color-text: #1f2937;
      --color-text-muted: #6b7280;
      --color-biopsy: #d97706;
      --color-epigenetic: #7c3aed;
      --color-success: #059669;
      --color-error: #dc2626;
      --plotly-font-color: #6b7280;
      --plotly-grid-color: #e5e7eb;
      --plotly-bg: transparent;
    }

    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-mono);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3d4e; }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--color-panel);
      border-bottom: 1px solid var(--color-border);
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 100;
    }

    #toolbar h1 {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .toolbar-sep {
      width: 1px;
      height: 24px;
      background: var(--color-border);
      flex-shrink: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .toolbar-group label {
      font-size: 11px;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    #patient-meta {
      font-size: 11px;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    #patient-meta .meta-value {
      color: var(--color-text);
      font-weight: 500;
    }

    /* ── Form controls ── */
    select, button, input[type="date"], input[type="file"] {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-panel-alt);
      color: var(--color-text);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    select:hover, button:hover, input[type="date"]:hover {
      border-color: var(--color-accent);
    }

    select:focus, input[type="date"]:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 1px var(--color-accent);
    }

    button {
      background: var(--color-border);
      font-weight: 500;
    }

    button:hover {
      background: #3a3d4e;
    }

    body.light button:hover {
      background: #e5e7eb;
    }

    input[type="date"] {
      width: 120px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
    }

    body.light input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none;
    }

    /* ── Theme toggle button ── */
    #btn-theme {
      font-size: 14px;
      padding: 3px 8px;
      line-height: 1;
    }

    /* ── Rename input ── */
    .track-name-input {
      background: var(--color-panel-alt);
      border: 1px solid var(--color-accent);
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 4px;
      border-radius: 3px;
      outline: none;
      width: 100%;
    }

    input[type="file"] { display: none; }

    /* ── Checkbox label ── */
    .chk-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--color-text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .chk-label input[type="checkbox"] { cursor: pointer; accent-color: var(--color-accent); }
    .chk-label select { margin-left: 2px; }

    /* ── Patient search combobox ── */
    .combo { position: relative; }
    #patient-input {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-panel-alt);
      color: var(--color-text);
      outline: none;
      width: 170px;
      transition: border-color 0.15s;
    }
    #patient-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 1px var(--color-accent);
    }
    .combo-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 200;
      width: 240px;
      max-height: 320px;
      overflow-y: auto;
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
    }
    .combo-list.open { display: block; }
    .combo-item {
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--color-border);
    }
    .combo-item:last-child { border-bottom: none; }
    .combo-item:hover, .combo-item.active {
      background: var(--color-panel-alt);
    }
    .combo-item .ci-id { color: var(--color-text); font-weight: 500; }
    .combo-item .ci-meta { color: var(--color-text-muted); font-size: 10px; }
    .combo-item mark { background: transparent; color: var(--color-accent); }
    .combo-empty { padding: 8px 10px; font-size: 11px; color: var(--color-text-muted); }
    .combo-more { padding: 6px 10px; font-size: 10px; color: var(--color-text-muted); text-align: center; }

    /* ── Insights modal ── */
    #insights-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #insights-overlay.open { display: flex; }
    #insights-modal {
      width: min(980px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 18px 20px 22px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .insights-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .insights-head h2 {
      font-family: var(--font-heading);
      font-size: 18px;
      color: var(--color-text);
    }
    .insights-sub { font-family: var(--font-mono); font-size: 12px; color: var(--color-accent); margin-left: 6px; }
    .insights-controls { display: flex; align-items: center; gap: 10px; }
    #btn-insights-close { font-size: 18px; line-height: 1; padding: 2px 9px; }
    .insights-note { font-size: 11px; color: var(--color-text-muted); margin: 8px 0 14px; max-width: 70ch; }
    #insights-body { display: flex; flex-direction: column; gap: 18px; }
    #insights-heatmap { width: 100%; min-height: 60px; }
    #insights-ranked { display: flex; flex-direction: column; gap: 14px; }
    .rank-block h3 {
      font-family: var(--font-heading);
      font-size: 13px;
      color: var(--color-text);
      margin-bottom: 6px;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 1fr 64px 44px;
      gap: 8px;
      align-items: center;
      padding: 5px 8px;
      font-size: 11px;
      border-bottom: 1px solid var(--color-border);
    }
    .rank-row .rr-pair { color: var(--color-text); }
    .rank-row .rr-r { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .rank-row .rr-n { color: var(--color-text-muted); text-align: right; font-variant-numeric: tabular-nums; }
    .rank-pos { color: #10b981; }
    .rank-neg { color: #ef4444; }
    .insights-empty { font-size: 12px; color: var(--color-text-muted); padding: 20px 0; text-align: center; }

    /* ── Main Layout ── */
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--color-panel);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text);
      letter-spacing: 0.3px;
    }

    .sidebar-actions {
      display: flex;
      gap: 4px;
    }

    .sidebar-actions button {
      font-size: 10px;
      padding: 2px 6px;
    }

    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    /* ── Category group ── */
    .category-group {
      margin-bottom: 2px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--color-panel-alt);
      cursor: pointer;
      user-select: none;
      font-size: 10px;
      font-weight: 500;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .category-header:hover {
      background: #1f2233;
    }

    body.light .category-header:hover {
      background: #e5e7eb;
    }

    .category-header .cat-color {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .category-header .cat-toggle {
      margin-left: auto;
      font-size: 9px;
      color: var(--color-text-muted);
    }

    .category-header input[type="checkbox"] {
      width: 12px;
      height: 12px;
      accent-color: var(--color-accent);
      cursor: pointer;
    }

    /* ── Track row ── */
    .track-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px 4px 20px;
      font-size: 11px;
      cursor: default;
      transition: background 0.1s;
      border-left: 2px solid transparent;
    }

    .track-row:hover {
      background: var(--color-panel-alt);
    }

    .track-row.dragging {
      opacity: 0.4;
    }

    .track-row.drag-over {
      border-bottom: 2px solid var(--color-accent);
    }

    .track-row input[type="checkbox"] {
      width: 12px;
      height: 12px;
      accent-color: var(--color-accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .track-row .drag-handle {
      cursor: grab;
      color: var(--color-text-muted);
      font-size: 10px;
      flex-shrink: 0;
      opacity: 0.4;
      user-select: none;
    }

    .track-row:hover .drag-handle {
      opacity: 1;
    }

    .track-row .track-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .track-row .track-unit {
      font-size: 9px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .track-row .overlay-cb {
      width: 12px;
      height: 12px;
      accent-color: var(--color-biopsy);
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .track-row:hover .overlay-cb,
    .track-row .overlay-cb:checked {
      opacity: 1;
    }

    .track-row .overlay-cb-label {
      font-size: 8px;
      color: var(--color-biopsy);
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
      user-select: none;
    }

    .track-row:hover .overlay-cb-label,
    .track-row:has(.overlay-cb:checked) .overlay-cb-label {
      opacity: 1;
    }

    .track-row input[type="color"] {
      width: 18px;
      height: 18px;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 0;
      cursor: pointer;
      background: none;
      flex-shrink: 0;
    }

    .track-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
    .track-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

    .track-row select.display-type {
      width: 60px;
      font-size: 9px;
      padding: 1px 2px;
      flex-shrink: 0;
    }

    .track-row .badge {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--color-accent);
      color: #000;
      font-weight: 600;
      flex-shrink: 0;
    }

    .track-row .btn-remove {
      font-size: 12px;
      color: var(--color-text-muted);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .track-row .btn-remove:hover {
      color: var(--color-error);
    }

    /* ── Overlay section ── */
    .overlay-section {
      padding: 8px 12px;
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .overlay-section h3 {
      font-size: 10px;
      font-weight: 500;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .overlay-section .overlay-btns {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .overlay-section button {
      font-size: 10px;
      padding: 3px 8px;
    }

    .overlay-group-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--color-panel-alt);
      border: 1px solid var(--color-border);
      margin: 2px 0;
    }

    .overlay-group-tag .split-btn {
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: 10px;
      border: none;
      background: none;
      padding: 0;
    }

    .overlay-group-tag .split-btn:hover {
      color: var(--color-error);
    }

    /* ── Chart Area ── */
    #chart-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      background: var(--color-bg);
    }

    #chart-container {
      min-height: 300px;
    }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    #loading .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Drop zone ── */
    #drop-zone {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(56, 189, 248, 0.08);
      border: 2px dashed var(--color-accent);
      z-index: 50;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--color-accent);
      font-weight: 500;
      pointer-events: none;
    }

    #drop-zone.visible {
      display: flex;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 18px;
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--color-text);
      z-index: 1000;
      transform: translateY(80px);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
    }

    #toast.visible {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- ── Toolbar ── -->
<header id="toolbar">
  <h1>NIR Lab &middot; Timeline</h1>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <label for="patient-input">Patient</label>
    <div class="combo" id="patient-combo">
      <input type="text" id="patient-input" placeholder="Search patient…" autocomplete="off" spellcheck="false">
      <div class="combo-list" id="patient-list-dd"></div>
    </div>
  </div>

  <span id="patient-meta"></span>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <label for="xaxis-mode" title="How the horizontal axis is labelled">X-axis</label>
    <select id="xaxis-mode">
      <option value="date">Calendar date</option>
      <option value="days">Days since first record</option>
    </select>
    <label class="chk-label" title="Mark the transplant date (when available)"><input type="checkbox" id="show-transplant"> Transplant marker</label>
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <label>From</label>
    <input type="date" id="date-from">
    <label>To</label>
    <input type="date" id="date-to">
    <button id="btn-date-apply">Apply</button>
    <button id="btn-date-reset">Reset</button>
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <button id="btn-insights" title="Correlation insights between tracks">◧ Insights</button>
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <button id="btn-theme" title="Toggle dark/light mode">&#9788;</button>
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <button id="btn-session-save" title="Export session as JSON">Save</button>
    <button id="btn-session-load" title="Import session from JSON">Load</button>
    <input type="file" id="file-session" accept=".json">
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <button id="btn-upload-bg" title="Upload bedGraph files">+ bedGraph</button>
    <input type="file" id="file-bedgraph" accept=".bedGraph,.bg" multiple>
    <button id="btn-upload-csv" title="Upload CSV data">+ CSV</button>
    <input type="file" id="file-csv" accept=".csv">
  </div>
</header>

<!-- ── Main Layout ── -->
<div id="main-layout">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Tracks</h2>
      <div class="sidebar-actions">
        <button id="btn-all">All</button>
        <button id="btn-none">None</button>
      </div>
    </div>

    <div class="track-list" id="track-list">
      <!-- populated by JS -->
    </div>

    <div class="overlay-section" id="overlay-section">
      <h3>Overlays</h3>
      <div class="overlay-btns">
        <button id="btn-create-overlay" disabled>Create Overlay</button>
        <button id="btn-split-all">Split All</button>
      </div>
      <div id="overlay-groups"></div>
    </div>
  </aside>

  <!-- Chart area -->
  <main id="chart-area">
    <div id="loading"><span class="spinner"></span> Loading...</div>
    <div id="chart-container"></div>
    <div id="drop-zone">Drop bedGraph or CSV files here</div>
  </main>
</div>

<!-- Insights modal -->
<div id="insights-overlay">
  <div id="insights-modal">
    <div class="insights-head">
      <h2>Correlation Insights <span id="insights-patient" class="insights-sub"></span></h2>
      <div class="insights-controls">
        <label class="chk-label" title="Pearson measures linear correlation; Spearman measures monotonic (rank) correlation">Method
          <select id="insights-method">
            <option value="pearson">Pearson</option>
            <option value="spearman">Spearman</option>
          </select>
        </label>
        <label class="chk-label" title="Minimum number of overlapping days required for a pair">Min overlap
          <select id="insights-minn">
            <option value="5">5</option>
            <option value="8" selected>8</option>
            <option value="12">12</option>
            <option value="20">20</option>
          </select>
        </label>
        <button id="btn-insights-close" title="Close">&times;</button>
      </div>
    </div>
    <p class="insights-note">Values are linearly interpolated onto a shared daily grid over each pair's overlapping window, then correlated. Correlation is not causation; pairs below the minimum overlap are skipped.</p>
    <div id="insights-body">
      <div id="insights-heatmap"></div>
      <div id="insights-ranked"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ═══════════════════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════════════════
  var STORAGE_KEY = "nir-lab-timeline-state";
  var STORAGE_VERSION = 7;
  var MAX_UPLOAD_SIZE = 5 * 1024 * 1024; // 5 MB

  var state = {
    config: null,
    selectedPatientId: null,
    trackOrder: [],
    trackEnabled: {},
    trackColors: {},
    trackDisplayTypes: {},
    trackNames: {},
    overlayGroups: [],
    dateRange: { from: null, to: null },
    theme: "dark",
    xAxisMode: "date",       // "date" | "days"
    showTransplant: false,   // optional transplant marker
    // Runtime only (not persisted)
    bedGraphCache: {},
    uploadedTracks: [],
    uploadedPatients: [],
    rendering: false
  };

  var DEFAULT_ENABLED = [
    "ALANINE.AM.TRAN (ALT)", "ASPART.AM.TRANS (AST)", "CREATININE",
    "WBC", "HGB", "PLATELETS"
  ];

  var DISPLAY_TYPES = [
    { value: "lines+markers", label: "Line+Dot" },
    { value: "markers",       label: "Dots" },
    { value: "bar",           label: "Bars" },
    { value: "area",          label: "Area" },
    { value: "step",          label: "Step" }
  ];

  // ═══════════════════════════════════════════════════════
  // UTILITY
  // ═══════════════════════════════════════════════════════
  function $(id) { return document.getElementById(id); }

  function dayToDate(refDate, day) {
    var d = new Date(refDate);
    d.setDate(d.getDate() + day);
    return d.toISOString().slice(0, 10);
  }

  function dateToDay(refDate, dateStr) {
    var ref = new Date(refDate);
    var d = new Date(dateStr);
    return Math.round((d - ref) / 86400000);
  }

  // X value for a given day offset, honouring the current axis mode.
  function xForDay(refDate, day) {
    return state.xAxisMode === "days" ? day : dayToDate(refDate, day);
  }

  // Human-readable label for a day offset (used in hover tooltips).
  function dayLabel(refDate, day) {
    if (state.xAxisMode === "days") {
      return "Day " + day + " (" + dayToDate(refDate, day) + ")";
    }
    return dayToDate(refDate, day) + " (Day " + day + ")";
  }

  function showToast(msg) {
    var toast = $("toast");
    toast.textContent = msg;
    toast.classList.add("visible");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () {
      toast.classList.remove("visible");
    }, 3000);
  }

  function getPatient(id) {
    if (!state.config) return null;
    var all = state.config.patients.concat(state.uploadedPatients);
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === id) return all[i];
    }
    return null;
  }

  function getAllTracks() {
    var tracks = [];
    if (state.config) {
      for (var i = 0; i < state.config.tracks.length; i++) {
        tracks.push({ idx: i, source: "server", track: state.config.tracks[i] });
      }
    }
    for (var j = 0; j < state.uploadedTracks.length; j++) {
      tracks.push({ idx: "u" + j, source: "uploaded", track: state.uploadedTracks[j] });
    }
    return tracks;
  }

  function getTrackByIdx(idx) {
    var all = getAllTracks();
    for (var i = 0; i < all.length; i++) {
      if (String(all[i].idx) === String(idx)) return all[i];
    }
    return null;
  }

  var TRACK_PALETTE = [
    '#4f8ef7','#10b981','#ef4444','#8b5cf6',
    '#06b6d4','#f97316','#84cc16','#ec4899','#14b8a6',
    '#a78bfa','#fb923c','#34d399','#f472b6','#60a5fa',
    '#facc15','#22d3ee','#c084fc','#fb7185','#2dd4bf',
    '#fbbf24','#818cf8','#4ade80','#f87171','#38bdf8',
    '#a3e635','#e879f9'
  ];

  function getDefaultColor(idx) {
    var numIdx = parseInt(String(idx).replace("u", ""), 10) || 0;
    return TRACK_PALETTE[numIdx % TRACK_PALETTE.length];
  }

  function getTrackColor(idx) {
    if (state.trackColors[idx]) return state.trackColors[idx];
    return getDefaultColor(idx);
  }

  function getTrackName(idx, track) {
    if (state.trackNames[idx]) return state.trackNames[idx];
    return track.name;
  }

  function getTrackDisplayType(idx) {
    return state.trackDisplayTypes[idx] || "lines+markers";
  }

  function isOverlaid(idx) {
    for (var g = 0; g < state.overlayGroups.length; g++) {
      if (state.overlayGroups[g].indexOf(String(idx)) !== -1) return true;
    }
    return false;
  }

  // ═══════════════════════════════════════════════════════
  // PERSISTENCE
  // ═══════════════════════════════════════════════════════
  function saveToLocalStorage() {
    try {
      var data = {
        selectedPatientId: state.selectedPatientId,
        trackOrder: state.trackOrder,
        trackEnabled: state.trackEnabled,
        trackColors: state.trackColors,
        trackDisplayTypes: state.trackDisplayTypes,
        trackNames: state.trackNames,
        overlayGroups: state.overlayGroups,
        dateRange: state.dateRange,
        theme: state.theme,
        xAxisMode: state.xAxisMode,
        showTransplant: state.showTransplant,
        uploadedTracks: state.uploadedTracks,
        uploadedPatients: state.uploadedPatients
      };
      data._version = STORAGE_VERSION;
      var json = JSON.stringify(data);
      if (json.length < MAX_UPLOAD_SIZE) {
        localStorage.setItem(STORAGE_KEY, json);
      }
    } catch (e) { /* localStorage full or unavailable */ }
  }

  function restoreSession() {
    try {
      var json = localStorage.getItem(STORAGE_KEY);
      if (!json) return false;
      var data = JSON.parse(json);
      if (data._version !== STORAGE_VERSION) {
        localStorage.removeItem(STORAGE_KEY);
        return false;
      }
      if (data.selectedPatientId) state.selectedPatientId = data.selectedPatientId;
      if (data.trackOrder) state.trackOrder = data.trackOrder;
      if (data.trackEnabled) state.trackEnabled = data.trackEnabled;
      if (data.trackColors) state.trackColors = data.trackColors;
      if (data.trackDisplayTypes) state.trackDisplayTypes = data.trackDisplayTypes;
      if (data.trackNames) state.trackNames = data.trackNames;
      if (data.overlayGroups) state.overlayGroups = data.overlayGroups;
      if (data.dateRange) state.dateRange = data.dateRange;
      if (data.theme) state.theme = data.theme;
      if (data.xAxisMode) state.xAxisMode = data.xAxisMode;
      if (typeof data.showTransplant === "boolean") state.showTransplant = data.showTransplant;
      if (data.uploadedTracks) state.uploadedTracks = data.uploadedTracks;
      if (data.uploadedPatients) state.uploadedPatients = data.uploadedPatients;
      return true;
    } catch (e) { return false; }
  }

  function exportSession() {
    var data = {
      selectedPatientId: state.selectedPatientId,
      trackOrder: state.trackOrder,
      trackEnabled: state.trackEnabled,
      trackColors: state.trackColors,
      trackDisplayTypes: state.trackDisplayTypes,
      trackNames: state.trackNames,
      overlayGroups: state.overlayGroups,
      dateRange: state.dateRange,
      theme: state.theme,
      xAxisMode: state.xAxisMode,
      showTransplant: state.showTransplant,
      uploadedTracks: state.uploadedTracks,
      uploadedPatients: state.uploadedPatients
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "nir-lab-session.json";
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("Session exported");
  }

  function importSession(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        if (data.selectedPatientId) state.selectedPatientId = data.selectedPatientId;
        if (data.trackOrder) state.trackOrder = data.trackOrder;
        if (data.trackEnabled) state.trackEnabled = data.trackEnabled;
        if (data.trackColors) state.trackColors = data.trackColors;
        if (data.trackDisplayTypes) state.trackDisplayTypes = data.trackDisplayTypes;
        if (data.trackNames) state.trackNames = data.trackNames;
        if (data.overlayGroups) state.overlayGroups = data.overlayGroups;
        if (data.dateRange) state.dateRange = data.dateRange;
        if (data.theme) { state.theme = data.theme; applyTheme(); }
        if (data.xAxisMode) state.xAxisMode = data.xAxisMode;
        if (typeof data.showTransplant === "boolean") state.showTransplant = data.showTransplant;
        if (data.uploadedTracks) state.uploadedTracks = data.uploadedTracks;
        if (data.uploadedPatients) state.uploadedPatients = data.uploadedPatients;
        saveToLocalStorage();
        populatePatientDropdown();
        rebuildSidebar();
        renderChart();
        showToast("Session imported");
      } catch (err) {
        showToast("Invalid session file");
      }
    };
    reader.readAsText(file);
  }

  // ═══════════════════════════════════════════════════════
  // DATA LOADING
  // ═══════════════════════════════════════════════════════
  async function loadConfig() {
    var resp = await fetch("config.json");
    if (!resp.ok) throw new Error("Failed to load config.json");
    state.config = await resp.json();
  }

  async function fetchBedGraph(file) {
    if (state.bedGraphCache[file]) return state.bedGraphCache[file];
    var resp = await fetch("bedgraphs_by_label/" + file);
    if (!resp.ok) return [];
    var text = await resp.text();
    var rows = [];
    var lines = text.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line.startsWith("track")) continue;
      var cols = line.split("\t");
      if (cols.length < 4) continue;
      rows.push({
        patientId: cols[0],
        day: parseInt(cols[2], 10),
        value: parseFloat(cols[3])
      });
    }
    state.bedGraphCache[file] = rows;
    return rows;
  }

  async function loadAllBedGraphs() {
    if (!state.config) return;
    var promises = state.config.tracks.map(function (t) {
      if (t.file) return fetchBedGraph(t.file);
      return Promise.resolve([]);
    });
    await Promise.all(promises);
  }

  function trackHasDataForPatient(trackInfo, patientId) {
    var rows;
    if (trackInfo.source === "uploaded") {
      var uIdxNum = parseInt(String(trackInfo.idx).replace("u", ""), 10);
      rows = state.bedGraphCache["_uploaded_" + uIdxNum] || (trackInfo.track._data || []);
    } else {
      rows = state.bedGraphCache[trackInfo.track.file] || [];
    }
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].patientId === patientId) return true;
    }
    return false;
  }

  function filterForPatient(rows, patientId) {
    return rows
      .filter(function (r) { return r.patientId === patientId; })
      .sort(function (a, b) { return a.day - b.day; });
  }

  function filterByDateRange(points, refDate) {
    if (!state.dateRange.from && !state.dateRange.to) return points;
    var fromDay = state.dateRange.from ? dateToDay(refDate, state.dateRange.from) : -Infinity;
    var toDay = state.dateRange.to ? dateToDay(refDate, state.dateRange.to) : Infinity;
    return points.filter(function (p) { return p.day >= fromDay && p.day <= toDay; });
  }

  // ═══════════════════════════════════════════════════════
  // INIT STATE
  // ═══════════════════════════════════════════════════════
  function initState() {
    if (!state.config) return;

    // Build track order if empty
    if (!state.trackOrder || state.trackOrder.length === 0) {
      state.trackOrder = state.config.tracks.map(function (_, i) { return i; });
    }

    // Build enabled defaults if empty — enable first 6 lab tracks
    if (!state.trackEnabled || Object.keys(state.trackEnabled).length === 0) {
      state.trackEnabled = {};
      var labCount = 0;
      state.config.tracks.forEach(function (t, i) {
        var isContinuous = !state.config.categories[t.category] || state.config.categories[t.category].type !== "event";
        if (isContinuous && labCount < 6) {
          state.trackEnabled[i] = true;
          labCount++;
        } else {
          state.trackEnabled[i] = false;
        }
      });
    }

    // Default patient
    if (!state.selectedPatientId && state.config.patients.length > 0) {
      state.selectedPatientId = state.config.patients[0].id;
    }
  }

  // ═══════════════════════════════════════════════════════
  // UI: TOOLBAR
  // ═══════════════════════════════════════════════════════
  // Sorted list of all patients (config + uploaded, de-duplicated).
  function getAllPatientsSorted() {
    var allPatients = state.config ? state.config.patients.slice() : [];
    state.uploadedPatients.forEach(function (p) {
      var exists = false;
      for (var i = 0; i < allPatients.length; i++) {
        if (allPatients[i].id === p.id) { exists = true; break; }
      }
      if (!exists) allPatients.push(p);
    });
    allPatients.sort(function (a, b) { return a.id.localeCompare(b.id); });
    return allPatients;
  }

  var comboActiveIdx = -1;   // highlighted item in the open dropdown
  var comboMatches = [];     // current filtered patient list

  function isUploadedPatient(id) {
    for (var j = 0; j < state.uploadedPatients.length; j++) {
      if (state.uploadedPatients[j].id === id) return true;
    }
    return false;
  }

  function renderPatientDropdown(filter) {
    var dd = $("patient-list-dd");
    dd.innerHTML = "";
    var f = (filter || "").trim().toLowerCase();
    var all = getAllPatientsSorted();
    comboMatches = f
      ? all.filter(function (p) {
          if (p.id.toLowerCase().indexOf(f) !== -1) return true;
          var organ = p.metadata && p.metadata.organ ? p.metadata.organ.toLowerCase() : "";
          return organ.indexOf(f) !== -1;
        })
      : all;

    if (comboMatches.length === 0) {
      var empty = document.createElement("div");
      empty.className = "combo-empty";
      empty.textContent = "No matching patients";
      dd.appendChild(empty);
      return;
    }

    var CAP = 200;
    var shown = comboMatches.slice(0, CAP);
    shown.forEach(function (p, i) {
      var item = document.createElement("div");
      item.className = "combo-item";
      item.setAttribute("data-id", p.id);
      if (i === comboActiveIdx) item.classList.add("active");

      var idSpan = document.createElement("span");
      idSpan.className = "ci-id";
      // Highlight the matched substring
      if (f && p.id.toLowerCase().indexOf(f) !== -1) {
        var pos = p.id.toLowerCase().indexOf(f);
        idSpan.innerHTML = escapeHtml(p.id.slice(0, pos)) + "<mark>" +
          escapeHtml(p.id.slice(pos, pos + f.length)) + "</mark>" +
          escapeHtml(p.id.slice(pos + f.length));
      } else {
        idSpan.textContent = p.id;
      }
      item.appendChild(idSpan);

      var metaBits = [];
      if (p.metadata && p.metadata.organ) metaBits.push(p.metadata.organ);
      if (isUploadedPatient(p.id)) metaBits.push("uploaded");
      var metaSpan = document.createElement("span");
      metaSpan.className = "ci-meta";
      metaSpan.textContent = metaBits.join(" · ");
      item.appendChild(metaSpan);

      item.addEventListener("mousedown", function (e) {
        e.preventDefault(); // keep focus / prevent blur before click
        selectPatient(p.id);
      });
      dd.appendChild(item);
    });

    if (comboMatches.length > CAP) {
      var more = document.createElement("div");
      more.className = "combo-more";
      more.textContent = (comboMatches.length - CAP) + " more… keep typing to narrow";
      dd.appendChild(more);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function openPatientDropdown() {
    comboActiveIdx = -1;
    renderPatientDropdown($("patient-input").value);
    $("patient-list-dd").classList.add("open");
  }

  function closePatientDropdown() {
    $("patient-list-dd").classList.remove("open");
    comboActiveIdx = -1;
  }

  function selectPatient(id) {
    if (!id) return;
    state.selectedPatientId = id;
    $("patient-input").value = id;
    closePatientDropdown();
    updatePatientInfo();
    saveToLocalStorage();
    rebuildSidebar();
    renderChart();
  }

  // Keep the input in sync with the selected patient (used on load / import).
  function populatePatientDropdown() {
    if (state.selectedPatientId) $("patient-input").value = state.selectedPatientId;
  }

  function setupPatientSearch() {
    var input = $("patient-input");
    var dd = $("patient-list-dd");

    input.addEventListener("focus", function () { openPatientDropdown(); });
    input.addEventListener("input", function () {
      comboActiveIdx = -1;
      renderPatientDropdown(this.value);
      dd.classList.add("open");
    });
    input.addEventListener("keydown", function (e) {
      var items = dd.querySelectorAll(".combo-item");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!dd.classList.contains("open")) { openPatientDropdown(); return; }
        comboActiveIdx = Math.min(comboActiveIdx + 1, items.length - 1);
        updateComboActive(items);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        comboActiveIdx = Math.max(comboActiveIdx - 1, 0);
        updateComboActive(items);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (comboActiveIdx >= 0 && items[comboActiveIdx]) {
          selectPatient(items[comboActiveIdx].getAttribute("data-id"));
        } else if (comboMatches.length === 1) {
          selectPatient(comboMatches[0].id);
        } else if (comboMatches.length > 0) {
          selectPatient(comboMatches[0].id);
        }
      } else if (e.key === "Escape") {
        closePatientDropdown();
        input.value = state.selectedPatientId || "";
        input.blur();
      }
    });

    // Close when clicking outside the combo
    document.addEventListener("click", function (e) {
      if (!$("patient-combo").contains(e.target)) {
        closePatientDropdown();
        // Restore a valid id if the user typed garbage and clicked away
        if (input.value !== state.selectedPatientId) {
          input.value = state.selectedPatientId || "";
        }
      }
    });
  }

  function updateComboActive(items) {
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", i === comboActiveIdx);
    }
    if (comboActiveIdx >= 0 && items[comboActiveIdx]) {
      items[comboActiveIdx].scrollIntoView({ block: "nearest" });
    }
  }

  function updatePatientInfo() {
    var meta = $("patient-meta");
    var p = getPatient(state.selectedPatientId);
    if (!p) { meta.textContent = ""; return; }
    var parts = [];
    if (p.metadata && p.metadata.organ) {
      parts.push("Organ: <span class='meta-value'>" + p.metadata.organ + "</span>");
    }
    if (p.metadata && p.metadata.birthYear && p.metadata.birthYear !== ".") {
      parts.push("Born: <span class='meta-value'>" + p.metadata.birthYear + "</span>");
    }
    if (p.referenceDate) {
      parts.push(p.referenceLabel + ": <span class='meta-value'>" + p.referenceDate + "</span>");
    }
    meta.innerHTML = parts.join(" &nbsp;|&nbsp; ");
  }

  function updateToolbarState() {
    // Date range
    if (state.dateRange.from) $("date-from").value = state.dateRange.from;
    if (state.dateRange.to) $("date-to").value = state.dateRange.to;
    // X-axis mode + transplant marker + patient input
    $("xaxis-mode").value = state.xAxisMode;
    $("show-transplant").checked = !!state.showTransplant;
    if (state.selectedPatientId) $("patient-input").value = state.selectedPatientId;
  }

  function applyTheme() {
    if (state.theme === "light") {
      document.body.classList.add("light");
    } else {
      document.body.classList.remove("light");
    }
  }

  function setupToolbarHandlers() {
    // X-axis mode
    $("xaxis-mode").addEventListener("change", function () {
      state.xAxisMode = this.value;
      saveToLocalStorage();
      renderChart();
    });

    // Transplant marker toggle
    $("show-transplant").addEventListener("change", function () {
      state.showTransplant = this.checked;
      saveToLocalStorage();
      renderChart();
    });

    // Insights
    $("btn-insights").addEventListener("click", openInsights);
    $("btn-insights-close").addEventListener("click", closeInsights);
    $("insights-overlay").addEventListener("click", function (e) {
      if (e.target === this) closeInsights();
    });
    $("insights-method").addEventListener("change", renderInsights);
    $("insights-minn").addEventListener("change", renderInsights);

    // Date range
    $("btn-date-apply").addEventListener("click", function () {
      state.dateRange.from = $("date-from").value || null;
      state.dateRange.to = $("date-to").value || null;
      saveToLocalStorage();
      renderChart();
    });
    $("btn-date-reset").addEventListener("click", function () {
      state.dateRange = { from: null, to: null };
      $("date-from").value = "";
      $("date-to").value = "";
      saveToLocalStorage();
      renderChart();
    });

    // Theme toggle
    $("btn-theme").addEventListener("click", function () {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
      saveToLocalStorage();
      renderChart();
    });

    // Session
    $("btn-session-save").addEventListener("click", exportSession);
    $("btn-session-load").addEventListener("click", function () {
      $("file-session").click();
    });
    $("file-session").addEventListener("change", function () {
      if (this.files.length) importSession(this.files[0]);
      this.value = "";
    });

    // Upload bedGraph
    $("btn-upload-bg").addEventListener("click", function () {
      $("file-bedgraph").click();
    });
    $("file-bedgraph").addEventListener("change", function () {
      if (this.files.length) onUploadBedGraph(this.files);
      this.value = "";
    });

    // Upload CSV
    $("btn-upload-csv").addEventListener("click", function () {
      $("file-csv").click();
    });
    $("file-csv").addEventListener("change", function () {
      if (this.files.length) onUploadCSV(this.files[0]);
      this.value = "";
    });
  }

  // ═══════════════════════════════════════════════════════
  // UI: SIDEBAR
  // ═══════════════════════════════════════════════════════
  function rebuildSidebar() {
    var list = $("track-list");
    list.innerHTML = "";

    if (!state.config) return;

    // Group tracks by category
    var categories = {};
    var catOrder = ["Lab Data", "Biopsies", "Epigenetic"];

    var pid = state.selectedPatientId;

    state.config.tracks.forEach(function (t, i) {
      var item = { idx: i, track: t, source: "server" };
      // Hide tracks with no data for the selected patient
      if (pid && !trackHasDataForPatient(item, pid)) return;
      var cat = t.category || "Lab Data";
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(item);
    });

    // Add uploaded tracks category
    if (state.uploadedTracks.length > 0) {
      var uploadedVisible = state.uploadedTracks.map(function (t, j) {
        return { idx: "u" + j, track: t, source: "uploaded" };
      }).filter(function (item) {
        return !pid || trackHasDataForPatient(item, pid);
      });
      if (uploadedVisible.length > 0) {
        catOrder.push("Uploaded");
        categories["Uploaded"] = uploadedVisible;
      }
    }

    // Reorder tracks within categories based on trackOrder
    catOrder.forEach(function (catName) {
      var tracks = categories[catName];
      if (!tracks || tracks.length === 0) return;

      var catColor = "#4f8ef7";
      if (state.config.categories[catName]) {
        catColor = state.config.categories[catName].color;
      } else if (catName === "Uploaded") {
        catColor = var_color_accent();
      }

      // Sort by trackOrder position
      tracks.sort(function (a, b) {
        var posA = state.trackOrder.indexOf(a.idx);
        var posB = state.trackOrder.indexOf(b.idx);
        if (posA === -1) posA = 9999;
        if (posB === -1) posB = 9999;
        return posA - posB;
      });

      // Category header
      var group = document.createElement("div");
      group.className = "category-group";

      var header = document.createElement("div");
      header.className = "category-header";

      var colorDot = document.createElement("span");
      colorDot.className = "cat-color";
      colorDot.style.background = catColor;
      header.appendChild(colorDot);

      var catCb = document.createElement("input");
      catCb.type = "checkbox";
      var allEnabled = tracks.every(function (t) { return state.trackEnabled[t.idx]; });
      catCb.checked = allEnabled;
      catCb.addEventListener("change", (function (trackList) {
        return function () {
          var checked = this.checked;
          trackList.forEach(function (t) {
            state.trackEnabled[t.idx] = checked;
          });
          saveToLocalStorage();
          rebuildSidebar();
          renderChart();
        };
      })(tracks));
      header.appendChild(catCb);

      var catLabel = document.createElement("span");
      catLabel.textContent = catName + " (" + tracks.length + ")";
      header.appendChild(catLabel);

      var catToggle = document.createElement("span");
      catToggle.className = "cat-toggle";
      catToggle.textContent = "\u25BC";
      header.appendChild(catToggle);

      group.appendChild(header);

      var trackContainer = document.createElement("div");
      trackContainer.className = "category-tracks";

      // Build track rows
      tracks.forEach(function (item) {
        var row = buildTrackRow(item.idx, item.track, item.source);
        trackContainer.appendChild(row);
      });

      group.appendChild(trackContainer);

      // Toggle collapse
      var collapsed = false;
      header.addEventListener("click", function (e) {
        if (e.target.tagName === "INPUT") return;
        collapsed = !collapsed;
        trackContainer.style.display = collapsed ? "none" : "";
        catToggle.textContent = collapsed ? "\u25B6" : "\u25BC";
      });

      list.appendChild(group);
    });

    updateOverlaySection();

    // Sidebar All/None buttons
    $("btn-all").onclick = function () {
      getAllTracks().forEach(function (t) { state.trackEnabled[t.idx] = true; });
      saveToLocalStorage();
      rebuildSidebar();
      renderChart();
    };
    $("btn-none").onclick = function () {
      getAllTracks().forEach(function (t) { state.trackEnabled[t.idx] = false; });
      saveToLocalStorage();
      rebuildSidebar();
      renderChart();
    };
  }

  function var_color_accent() { return "#38bdf8"; }

  function buildTrackRow(idx, track, source) {
    var row = document.createElement("div");
    row.className = "track-row";
    row.setAttribute("data-idx", idx);
    row.draggable = true;

    // Drag handle
    var handle = document.createElement("span");
    handle.className = "drag-handle";
    handle.textContent = "\u2630";
    row.appendChild(handle);

    // Enable checkbox
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!state.trackEnabled[idx];
    cb.addEventListener("change", function () {
      state.trackEnabled[idx] = cb.checked;
      saveToLocalStorage();
      renderChart();
    });
    row.appendChild(cb);

    var isEvent = track.category === "Biopsies" || (state.config && state.config.categories[track.category] && state.config.categories[track.category].type === "event");

    // Track name (double-click to rename)
    var displayName = getTrackName(idx, track);
    var nameSpan = document.createElement("span");
    nameSpan.className = "track-name";
    nameSpan.textContent = displayName;
    nameSpan.title = "Double-click to rename — " + displayName + (track.unit ? " (" + track.unit + ")" : "");
    nameSpan.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      var input = document.createElement("input");
      input.type = "text";
      input.className = "track-name-input";
      input.value = getTrackName(idx, track);
      nameSpan.textContent = "";
      nameSpan.appendChild(input);
      input.focus();
      input.select();
      function finishRename() {
        var newName = input.value.trim();
        if (newName && newName !== track.name) {
          state.trackNames[idx] = newName;
        } else if (newName === track.name) {
          delete state.trackNames[idx];
        }
        nameSpan.textContent = getTrackName(idx, track);
        nameSpan.title = "Double-click to rename — " + getTrackName(idx, track) + (track.unit ? " (" + track.unit + ")" : "");
        saveToLocalStorage();
        renderChart();
      }
      input.addEventListener("blur", finishRename);
      input.addEventListener("keydown", function (ke) {
        if (ke.key === "Enter") { input.blur(); }
        if (ke.key === "Escape") { input.value = track.name; input.blur(); }
      });
    });
    row.appendChild(nameSpan);

    // Unit label
    if (track.unit) {
      var unitSpan = document.createElement("span");
      unitSpan.className = "track-unit";
      unitSpan.textContent = track.unit;
      row.appendChild(unitSpan);
    }

    // Overlay checkbox (after name, right side — hidden until hover)
    if (!isEvent) {
      var oCbLabel = document.createElement("span");
      oCbLabel.className = "overlay-cb-label";
      oCbLabel.textContent = "ovl";
      row.appendChild(oCbLabel);

      var oCb = document.createElement("input");
      oCb.type = "checkbox";
      oCb.className = "overlay-cb";
      oCb.title = "Select for overlay";
      oCb.checked = isOverlaid(idx);
      oCb.addEventListener("change", function () {
        updateOverlayButtonState();
      });
      row.appendChild(oCb);
    }

    // LOCAL badge for uploaded
    if (source === "uploaded") {
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "LOCAL";
      row.appendChild(badge);
    }

    // Display type dropdown (only for continuous)
    if (!isEvent) {
      var dtSel = document.createElement("select");
      dtSel.className = "display-type";
      DISPLAY_TYPES.forEach(function (dt) {
        var opt = document.createElement("option");
        opt.value = dt.value;
        opt.textContent = dt.label;
        dtSel.appendChild(opt);
      });
      dtSel.value = getTrackDisplayType(idx);
      dtSel.addEventListener("change", function () {
        state.trackDisplayTypes[idx] = dtSel.value;
        saveToLocalStorage();
        renderChart();
      });
      row.appendChild(dtSel);
    }

    // Color picker
    var colorInput = document.createElement("input");
    colorInput.type = "color";
    colorInput.value = getTrackColor(idx);
    colorInput.addEventListener("input", function () {
      state.trackColors[idx] = colorInput.value;
      saveToLocalStorage();
      renderChart();
    });
    row.appendChild(colorInput);

    // Remove button for uploaded tracks
    if (source === "uploaded") {
      var removeBtn = document.createElement("button");
      removeBtn.className = "btn-remove";
      removeBtn.textContent = "\u00D7";
      removeBtn.title = "Remove track";
      removeBtn.addEventListener("click", function () {
        var uIdx = parseInt(String(idx).replace("u", ""), 10);
        state.uploadedTracks.splice(uIdx, 1);
        // Remove from enabled/colors/displayTypes
        delete state.trackEnabled[idx];
        delete state.trackColors[idx];
        delete state.trackDisplayTypes[idx];
        // Remove from overlay groups
        state.overlayGroups = state.overlayGroups.map(function (g) {
          return g.filter(function (i) { return i !== String(idx); });
        }).filter(function (g) { return g.length > 1; });
        saveToLocalStorage();
        rebuildSidebar();
        renderChart();
      });
      row.appendChild(removeBtn);
    }

    // Drag events
    row.addEventListener("dragstart", function (e) {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(idx));
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", function () {
      row.classList.remove("dragging");
      document.querySelectorAll(".track-row.drag-over").forEach(function (el) {
        el.classList.remove("drag-over");
      });
    });
    row.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", function () {
      row.classList.remove("drag-over");
    });
    row.addEventListener("drop", function (e) {
      e.preventDefault();
      row.classList.remove("drag-over");
      var fromIdx = e.dataTransfer.getData("text/plain");
      var toIdx = String(idx);
      if (fromIdx === toIdx) return;

      // Reorder in trackOrder
      var fromPos = state.trackOrder.indexOf(isNaN(fromIdx) ? fromIdx : parseInt(fromIdx, 10));
      var toPos = state.trackOrder.indexOf(isNaN(toIdx) ? toIdx : parseInt(toIdx, 10));

      // Handle uploaded track indices
      if (fromPos === -1) {
        fromPos = state.trackOrder.indexOf(fromIdx);
      }
      if (toPos === -1) {
        toPos = state.trackOrder.indexOf(toIdx);
      }

      if (fromPos !== -1 && toPos !== -1) {
        var item = state.trackOrder.splice(fromPos, 1)[0];
        var newToPos = state.trackOrder.indexOf(isNaN(toIdx) ? toIdx : parseInt(toIdx, 10));
        if (newToPos === -1) newToPos = state.trackOrder.indexOf(toIdx);
        state.trackOrder.splice(newToPos, 0, item);
        saveToLocalStorage();
        rebuildSidebar();
        renderChart();
      }
    });

    return row;
  }

  // ═══════════════════════════════════════════════════════
  // OVERLAY SYSTEM
  // ═══════════════════════════════════════════════════════
  function getOverlayChecked() {
    var checked = [];
    document.querySelectorAll(".overlay-cb:checked").forEach(function (cb) {
      var row = cb.closest(".track-row");
      if (row) checked.push(row.getAttribute("data-idx"));
    });
    return checked;
  }

  function updateOverlayButtonState() {
    var checked = getOverlayChecked();
    $("btn-create-overlay").disabled = checked.length < 2;
  }

  function updateOverlaySection() {
    var container = $("overlay-groups");
    container.innerHTML = "";

    state.overlayGroups.forEach(function (group, gIdx) {
      var tag = document.createElement("div");
      tag.className = "overlay-group-tag";

      var names = group.map(function (idx) {
        var t = getTrackByIdx(idx);
        return t ? getTrackName(idx, t.track) : idx;
      });
      tag.innerHTML = "<span>Group " + (gIdx + 1) + ": " + names.join(", ") + "</span>";

      var splitBtn = document.createElement("button");
      splitBtn.className = "split-btn";
      splitBtn.textContent = "\u00D7";
      splitBtn.title = "Split this group";
      splitBtn.addEventListener("click", function () {
        state.overlayGroups.splice(gIdx, 1);
        saveToLocalStorage();
        rebuildSidebar();
        renderChart();
      });
      tag.appendChild(splitBtn);

      container.appendChild(tag);
    });

    // Wire overlay buttons
    $("btn-create-overlay").onclick = function () {
      var checked = getOverlayChecked();
      if (checked.length < 2) return;

      // Allow same track in multiple overlays — just add the new group
      state.overlayGroups.push(checked);
      saveToLocalStorage();
      rebuildSidebar();
      renderChart();
      showToast("Overlay created with " + checked.length + " tracks");
    };

    $("btn-split-all").onclick = function () {
      state.overlayGroups = [];
      saveToLocalStorage();
      rebuildSidebar();
      renderChart();
      showToast("All overlays split");
    };

    updateOverlayButtonState();
  }

  // ═══════════════════════════════════════════════════════
  // FILE UPLOAD
  // ═══════════════════════════════════════════════════════
  function parseBedGraphText(text, name) {
    var rows = [];
    var lines = text.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line.startsWith("track")) continue;
      var cols = line.split("\t");
      if (cols.length < 4) continue;
      rows.push({
        patientId: cols[0],
        day: parseInt(cols[2], 10),
        value: parseFloat(cols[3])
      });
    }
    return rows;
  }

  function onUploadBedGraph(files) {
    var count = 0;
    for (var i = 0; i < files.length; i++) {
      (function (file) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var trackName = file.name.replace(/\.(bedGraph|bg)$/i, "");
          var rows = parseBedGraphText(e.target.result, trackName);

          var uIdx = state.uploadedTracks.length;
          state.uploadedTracks.push({
            name: trackName,
            file: null,
            category: "Uploaded",
            unit: "",
            _data: rows
          });
          state.trackEnabled["u" + uIdx] = true;
          state.trackOrder.push("u" + uIdx);
          state.bedGraphCache["_uploaded_" + uIdx] = rows;

          count++;
          if (count === files.length) {
            saveToLocalStorage();
            rebuildSidebar();
            renderChart();
            showToast(count + " bedGraph file(s) uploaded");
          }
        };
        reader.readAsText(file);
      })(files[i]);
    }
  }

  function onUploadCSV(file) {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function (results) {
        parseCSVForPatients(results.data);
      },
      error: function () {
        showToast("Error parsing CSV");
      }
    });
  }

  function parseCSVForPatients(rows) {
    // Expected columns: PatientID, Date, Label, Value, Category (optional)
    // Group by PatientID and Label
    var patientMap = {};
    var trackMap = {};

    rows.forEach(function (row) {
      var pid = row.PatientID || row.patientId || row.Patient || row.patient_id;
      var dateStr = row.Date || row.date;
      var label = row.Label || row.label;
      var value = parseFloat(row.Value || row.value);

      if (!pid || !dateStr || !label) return;

      // Parse date
      var dateObj;
      // Try various date formats
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}$/)) {
        var parts = dateStr.split("/");
        dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
      } else {
        dateObj = new Date(dateStr);
      }
      if (isNaN(dateObj.getTime())) return;

      // Track patients
      if (!patientMap[pid]) {
        patientMap[pid] = { dates: [], id: pid };
      }
      patientMap[pid].dates.push(dateObj);

      // Track data by label
      if (!trackMap[label]) trackMap[label] = {};
      if (!trackMap[label][pid]) trackMap[label][pid] = [];
      trackMap[label][pid].push({ date: dateObj, value: value });
    });

    // Create patients: referenceDate = earliest date
    var newPatients = [];
    Object.keys(patientMap).forEach(function (pid) {
      var dates = patientMap[pid].dates;
      dates.sort(function (a, b) { return a - b; });
      var refDate = dates[0].toISOString().slice(0, 10);

      // Check if patient already exists
      var existing = getPatient(pid);
      if (!existing) {
        newPatients.push({
          id: pid,
          referenceDate: refDate,
          referenceLabel: "First Record",
          metadata: {}
        });
      }
    });

    state.uploadedPatients = state.uploadedPatients.concat(newPatients);

    // Create tracks
    Object.keys(trackMap).forEach(function (label) {
      var uIdx = state.uploadedTracks.length;
      var allRows = [];

      Object.keys(trackMap[label]).forEach(function (pid) {
        var patient = getPatient(pid);
        var refDate = patient ? patient.referenceDate : null;
        if (!refDate && patientMap[pid]) {
          var dates = patientMap[pid].dates;
          dates.sort(function (a, b) { return a - b; });
          refDate = dates[0].toISOString().slice(0, 10);
        }
        if (!refDate) return;

        trackMap[label][pid].forEach(function (entry) {
          var dayOffset = Math.round((entry.date - new Date(refDate)) / 86400000);
          allRows.push({
            patientId: pid,
            day: dayOffset,
            value: entry.value
          });
        });
      });

      state.uploadedTracks.push({
        name: label,
        file: null,
        category: "Uploaded",
        unit: "",
        _data: allRows
      });
      state.trackEnabled["u" + uIdx] = true;
      state.trackOrder.push("u" + uIdx);
      state.bedGraphCache["_uploaded_" + uIdx] = allRows;
    });

    saveToLocalStorage();
    populatePatientDropdown();
    rebuildSidebar();
    renderChart();
    showToast(newPatients.length + " patient(s), " + Object.keys(trackMap).length + " track(s) from CSV");
  }

  function setupDropZone() {
    var chartArea = $("chart-area");
    var dropZone = $("drop-zone");
    var dragCounter = 0;

    chartArea.addEventListener("dragenter", function (e) {
      e.preventDefault();
      dragCounter++;
      dropZone.classList.add("visible");
    });
    chartArea.addEventListener("dragleave", function () {
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropZone.classList.remove("visible");
      }
    });
    chartArea.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
    });
    chartArea.addEventListener("drop", function (e) {
      e.preventDefault();
      dragCounter = 0;
      dropZone.classList.remove("visible");

      var files = e.dataTransfer.files;
      if (!files.length) return;

      var bgFiles = [];
      var csvFile = null;

      for (var i = 0; i < files.length; i++) {
        var name = files[i].name.toLowerCase();
        if (name.endsWith(".bedgraph") || name.endsWith(".bg")) {
          bgFiles.push(files[i]);
        } else if (name.endsWith(".csv")) {
          csvFile = files[i];
        }
      }

      if (bgFiles.length) onUploadBedGraph(bgFiles);
      if (csvFile) onUploadCSV(csvFile);
    });
  }

  // ═══════════════════════════════════════════════════════
  // CHART RENDERING
  // ═══════════════════════════════════════════════════════
  async function renderChart() {
    if (state.rendering) return;
    state.rendering = true;

    var container = $("chart-container");
    var loadingEl = $("loading");
    var patient = getPatient(state.selectedPatientId);

    if (!patient) {
      container.innerHTML = "";
      loadingEl.style.display = "flex";
      loadingEl.innerHTML = "<span class='spinner'></span> Select a patient";
      state.rendering = false;
      return;
    }

    var refDate = patient.referenceDate;

    // Collect all enabled tracks
    var allTracks = getAllTracks();
    var enabledTracks = allTracks.filter(function (t) {
      // Only render tracks that are enabled AND actually have data for this
      // patient — avoids empty subplots when switching between patients.
      return state.trackEnabled[t.idx] && trackHasDataForPatient(t, state.selectedPatientId);
    });

    if (enabledTracks.length === 0) {
      Plotly.purge(container);
      loadingEl.style.display = "flex";
      loadingEl.innerHTML = "Enable tracks in the sidebar to view data";
      state.rendering = false;
      return;
    }

    loadingEl.style.display = "flex";
    loadingEl.innerHTML = "<span class='spinner'></span> Loading tracks...";

    // Classify tracks
    var continuousTracks = [];
    var eventTracks = [];

    enabledTracks.forEach(function (t) {
      var catType = "continuous";
      if (state.config && state.config.categories[t.track.category]) {
        catType = state.config.categories[t.track.category].type;
      }
      if (catType === "event") eventTracks.push(t);
      else continuousTracks.push(t);
    });

    // Sort by trackOrder
    continuousTracks.sort(function (a, b) {
      var posA = state.trackOrder.indexOf(a.idx);
      var posB = state.trackOrder.indexOf(b.idx);
      if (posA === -1) posA = state.trackOrder.indexOf(String(a.idx));
      if (posB === -1) posB = state.trackOrder.indexOf(String(b.idx));
      if (posA === -1) posA = 9999;
      if (posB === -1) posB = 9999;
      return posA - posB;
    });

    // Separate into individual tracks and overlay groups
    var overlaidIdxs = new Set();
    state.overlayGroups.forEach(function (group) {
      group.forEach(function (idx) { overlaidIdxs.add(String(idx)); });
    });

    var individualContinuous = continuousTracks.filter(function (t) {
      return !overlaidIdxs.has(String(t.idx));
    });

    // Build row structure: individual continuous, overlay groups, events at bottom
    var rows = []; // Each row: { type: 'single'|'overlay'|'event', tracks: [], height: N }

    individualContinuous.forEach(function (t) {
      rows.push({ type: "single", tracks: [t], height: 150 });
    });

    state.overlayGroups.forEach(function (group) {
      var groupTracks = group.map(function (idx) {
        return getTrackByIdx(idx);
      }).filter(function (t) {
        if (!t) return false;
        return (state.trackEnabled[t.idx] || state.trackEnabled[String(t.idx)]) &&
               trackHasDataForPatient(t, state.selectedPatientId);
      });
      if (groupTracks.length > 0) {
        rows.push({ type: "overlay", tracks: groupTracks, height: 180 });
      }
    });

    if (eventTracks.length > 0) {
      rows.push({ type: "event", tracks: eventTracks, height: 80 });
    }

    if (rows.length === 0) {
      Plotly.purge(container);
      loadingEl.style.display = "flex";
      loadingEl.innerHTML = "No data to display";
      state.rendering = false;
      return;
    }

    // Fetch all needed bedGraph files
    var fetchPromises = [];
    enabledTracks.forEach(function (t) {
      if (t.source === "uploaded") {
        // Already cached
        var uIdxNum = parseInt(String(t.idx).replace("u", ""), 10);
        if (!state.bedGraphCache["_uploaded_" + uIdxNum] && t.track._data) {
          state.bedGraphCache["_uploaded_" + uIdxNum] = t.track._data;
        }
      } else if (t.track.file) {
        fetchPromises.push(fetchBedGraph(t.track.file));
      }
    });

    try {
      await Promise.all(fetchPromises);
    } catch (e) {
      loadingEl.innerHTML = "Error loading data: " + e.message;
      state.rendering = false;
      return;
    }

    // Compute subplot domains
    var totalHeight = 0;
    rows.forEach(function (r) { totalHeight += r.height; });
    var gap = 30;
    var totalWithGap = totalHeight + (rows.length - 1) * gap;

    var traces = [];
    var fontColor = getComputedStyle(document.body).getPropertyValue('--plotly-font-color').trim() || "#9ca3af";
    var gridColor = getComputedStyle(document.body).getPropertyValue('--plotly-grid-color').trim() || "#1e2130";
    var layout = {
      paper_bgcolor: "transparent",
      plot_bgcolor: "transparent",
      showlegend: false,
      margin: { t: 15, b: 50, l: 70, r: 20 },
      font: { family: "'IBM Plex Mono', monospace", color: fontColor, size: 10 },
      height: totalWithGap + 60
    };

    var axisCount = 0;
    var currentTop = 1;

    rows.forEach(function (row, rIdx) {
      var fraction = row.height / totalWithGap;
      var gapFraction = gap / totalWithGap;
      var domainTop = currentTop;
      var domainBottom = currentTop - fraction;
      currentTop = domainBottom - gapFraction;

      axisCount++;
      var yAxisName = axisCount === 1 ? "y" : "y" + axisCount;
      var yAxisKey = axisCount === 1 ? "yaxis" : "yaxis" + axisCount;
      var xAxisName = axisCount === 1 ? "x" : "x" + axisCount;
      var xAxisKey = axisCount === 1 ? "xaxis" : "xaxis" + axisCount;

      if (row.type === "single") {
        var t = row.tracks[0];
        var pts = getTrackData(t, refDate);
        var color = getTrackColor(t.idx);
        var displayType = getTrackDisplayType(t.idx);
        var trace = buildContinuousTrace(t, pts, color, displayType, xAxisName, yAxisName, refDate);
        traces.push(trace);

        var tName = getTrackName(t.idx, t.track);
        layout[yAxisKey] = {
          domain: [Math.max(0, domainBottom), Math.min(1, domainTop)],
          title: {
            text: tName + (t.track.unit ? " (" + t.track.unit + ")" : ""),
            font: { size: 10, color: fontColor },
            standoff: 4
          },
          color: fontColor,
          gridcolor: gridColor,
          tickfont: { size: 9, color: fontColor },
          zeroline: false
        };
      } else if (row.type === "overlay") {
        layout.showlegend = true;
        var legendBg = state.theme === "light" ? "rgba(255,255,255,0.9)" : "rgba(17,24,39,0.85)";
        var legendBorder = state.theme === "light" ? "#d1d5db" : "#2a2d3e";
        var legendFont = state.theme === "light" ? "#1f2937" : "#e0e0e0";
        layout.legend = {
          bgcolor: legendBg,
          bordercolor: legendBorder,
          borderwidth: 1,
          font: { size: 10, color: legendFont },
          x: 1, xanchor: "right",
          y: domainTop, yanchor: "top",
          tracegroupgap: 4
        };

        // Decide whether tracks share a unit. If not, normalise each to 0..1
        // so differently-scaled measurements are visually comparable.
        var units = {};
        row.tracks.forEach(function (t) { units[(t.track.unit || "").trim()] = 1; });
        var sharedUnit = Object.keys(units).length === 1;
        var normalize = !sharedUnit;

        row.tracks.forEach(function (t) {
          var pts = getTrackData(t, refDate);
          var color = getTrackColor(t.idx);
          var displayType = getTrackDisplayType(t.idx);
          var trace = buildOverlayTrace(t, pts, color, displayType, xAxisName, yAxisName, refDate, normalize);
          trace.showlegend = true;
          traces.push(trace);
        });

        var yTitle = normalize
          ? "normalized 0–1"
          : (row.tracks[0].track.unit || "value");

        layout[yAxisKey] = {
          domain: [Math.max(0, domainBottom), Math.min(1, domainTop)],
          title: { text: yTitle, font: { size: 9, color: fontColor }, standoff: 4 },
          color: fontColor,
          gridcolor: gridColor,
          tickfont: { size: 9, color: fontColor },
          zeroline: false
        };
        if (normalize) { layout[yAxisKey].range = [-0.05, 1.05]; }
      } else if (row.type === "event") {
        row.tracks.forEach(function (t) {
          var pts = getTrackData(t, refDate);
          traces.push(buildEventTrace(t, pts, xAxisName, yAxisName, refDate));
        });

        layout[yAxisKey] = {
          domain: [Math.max(0, domainBottom), Math.min(1, domainTop)],
          color: fontColor,
          gridcolor: gridColor,
          tickfont: { size: 9, color: fontColor },
          zeroline: false
        };
      }

      // X axis for this row — calendar dates or day offsets from first record
      var isDateMode = state.xAxisMode !== "days";
      layout[xAxisKey] = {
        type: isDateMode ? "date" : "linear",
        color: fontColor,
        gridcolor: gridColor,
        tickfont: { size: 9, color: fontColor },
        anchor: yAxisName,
        zeroline: false
      };

      // Only show x-axis title on bottom row
      if (rIdx === rows.length - 1) {
        layout[xAxisKey].title = {
          text: isDateMode ? "Date" : "Days since first record",
          font: { size: 11, color: fontColor }
        };
      }

      // Shared x-axis range: link all to first x-axis via matches
      if (axisCount > 1) {
        layout[xAxisKey].matches = "x";
      }

      // Date range filter (only meaningful on the calendar-date axis;
      // in day mode the data itself is already filtered by filterByDateRange)
      if (isDateMode && (state.dateRange.from || state.dateRange.to)) {
        if (axisCount === 1) {
          layout[xAxisKey].range = [state.dateRange.from || undefined, state.dateRange.to || undefined];
        }
      }
    });

    // Optional transplant marker (only when the patient has a transplant date
    // and the toggle is on). The x-axis itself is anchored at the first record.
    layout.annotations = [];
    layout.shapes = [];
    if (state.showTransplant && patient.transplantDate) {
      var tDay = dateToDay(refDate, patient.transplantDate);
      var tX = state.xAxisMode === "days" ? tDay : patient.transplantDate;
      var annotBg = state.theme === "light" ? "rgba(255,255,255,0.9)" : "rgba(17,24,39,0.8)";
      layout.annotations.push({
        x: tX, y: 1, xref: "x", yref: "paper",
        text: "Transplant", showarrow: true, arrowhead: 0,
        arrowcolor: "#f59e0b88", ax: 0, ay: -30,
        font: { size: 10, color: "#f59e0b" },
        bgcolor: annotBg, bordercolor: "#f59e0b44", borderwidth: 1, borderpad: 3
      });
      layout.shapes.push({
        type: "line", x0: tX, x1: tX, y0: 0, y1: 1,
        xref: "x", yref: "paper",
        line: { color: "#f59e0b44", width: 1, dash: "dash" }
      });
    }

    loadingEl.style.display = "none";

    var plotConfig = {
      responsive: true,
      displayModeBar: true,
      scrollZoom: false,
      modeBarButtonsToRemove: ["lasso2d", "select2d"]
    };

    Plotly.purge(container);
    Plotly.newPlot(container, traces, layout, plotConfig);

    state.rendering = false;
  }

  function getTrackData(trackInfo, refDate) {
    var rows;
    if (trackInfo.source === "uploaded") {
      var uIdxNum = parseInt(String(trackInfo.idx).replace("u", ""), 10);
      rows = state.bedGraphCache["_uploaded_" + uIdxNum] || [];
    } else {
      rows = state.bedGraphCache[trackInfo.track.file] || [];
    }
    var pts = filterForPatient(rows, state.selectedPatientId);
    pts = filterByDateRange(pts, refDate);
    return pts;
  }

  function buildContinuousTrace(trackInfo, pts, color, displayType, xAxis, yAxis, refDate) {
    var xVals = pts.map(function (p) { return xForDay(refDate, p.day); });
    var yVals = pts.map(function (p) { return p.value; });

    var displayName = getTrackName(trackInfo.idx, trackInfo.track);
    var hoverText = pts.map(function (p) {
      return "<b>" + displayName + "</b><br>" +
        dayLabel(refDate, p.day) + "<br>" +
        "Value: " + p.value.toFixed(2) +
        (trackInfo.track.unit ? " " + trackInfo.track.unit : "") +
        "<extra></extra>";
    });

    var trace = {
      name: displayName,
      x: xVals,
      y: yVals,
      hovertemplate: "%{text}",
      text: hoverText,
      xaxis: xAxis,
      yaxis: yAxis,
      showlegend: false
    };

    if (displayType === "bar") {
      trace.type = "bar";
      trace.marker = { color: color, opacity: 0.8 };
    } else if (displayType === "area") {
      trace.type = "scatter";
      trace.mode = "lines";
      trace.fill = "tozeroy";
      trace.fillcolor = color + "33";
      trace.line = { color: color, width: 1.5 };
    } else if (displayType === "step") {
      trace.type = "scatter";
      trace.mode = "lines+markers";
      trace.line = { color: color, width: 1.5, shape: "hv" };
      trace.marker = { size: 4, color: color };
    } else if (displayType === "markers") {
      trace.type = "scatter";
      trace.mode = "markers";
      trace.marker = { size: 6, color: color };
    } else {
      // lines+markers (default)
      trace.type = "scatter";
      trace.mode = "lines+markers";
      trace.line = { color: color, width: 1.5 };
      trace.marker = { size: 4, color: color };
    }

    return trace;
  }

  // Overlay trace: like a continuous trace, but optionally min–max normalized
  // so tracks with different units are visually comparable on a shared 0..1 axis.
  function buildOverlayTrace(trackInfo, pts, color, displayType, xAxis, yAxis, refDate, normalize) {
    if (!normalize) {
      var t0 = buildContinuousTrace(trackInfo, pts, color, displayType, xAxis, yAxis, refDate);
      return t0;
    }
    var vals = pts.map(function (p) { return p.value; });
    var mn = Math.min.apply(null, vals);
    var mx = Math.max.apply(null, vals);
    var span = (mx - mn) || 1;
    var displayName = getTrackName(trackInfo.idx, trackInfo.track);
    var unit = trackInfo.track.unit ? " " + trackInfo.track.unit : "";
    var xVals = pts.map(function (p) { return xForDay(refDate, p.day); });
    var yVals = pts.map(function (p) { return (p.value - mn) / span; });
    var hoverText = pts.map(function (p) {
      return "<b>" + displayName + "</b><br>" +
        dayLabel(refDate, p.day) + "<br>" +
        "Value: " + p.value.toFixed(2) + unit +
        "<extra></extra>";
    });
    var trace = {
      name: displayName,
      x: xVals, y: yVals,
      hovertemplate: "%{text}", text: hoverText,
      xaxis: xAxis, yaxis: yAxis, showlegend: false
    };
    if (displayType === "bar") {
      trace.type = "bar"; trace.marker = { color: color, opacity: 0.6 };
    } else if (displayType === "markers") {
      trace.type = "scatter"; trace.mode = "markers"; trace.marker = { size: 6, color: color };
    } else {
      trace.type = "scatter"; trace.mode = "lines+markers";
      trace.line = { color: color, width: 1.5, shape: (displayType === "step" ? "hv" : "linear") };
      trace.marker = { size: 4, color: color };
      if (displayType === "area") { trace.fill = "tozeroy"; trace.fillcolor = color + "22"; }
    }
    return trace;
  }

  function buildEventTrace(trackInfo, pts, xAxis, yAxis, refDate) {
    var xVals = pts.map(function (p) { return xForDay(refDate, p.day); });

    var displayName = getTrackName(trackInfo.idx, trackInfo.track);
    var hoverText = pts.map(function (p) {
      return "<b>" + displayName + "</b><br>" +
        dayLabel(refDate, p.day) +
        "<extra></extra>";
    });

    return {
      type: "scatter",
      mode: "markers",
      name: displayName,
      x: xVals,
      y: pts.map(function () { return displayName; }),
      hovertemplate: "%{text}",
      text: hoverText,
