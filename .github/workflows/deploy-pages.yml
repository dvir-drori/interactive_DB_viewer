name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nir_lab/frontend/package-lock.json

      - name: Install dependencies
        working-directory: nir_lab/frontend
        run: npm ci

      - name: Build
        working-directory: nir_lab/frontend
        run: npm run build
        env:
          VITE_BASE: /interactive_DB_viewer/

      - name: Copy index.html to 404.html for SPA routing
        run: cp nir_lab/backend/static/index.html nir_lab/backend/static/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nir_lab/backend/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
