name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nir_lab/frontend/package-lock.json

      - name: Install dependencies
        working-directory: nir_lab/frontend
        run: npm ci

      - name: Build
        working-directory: nir_lab/frontend
        run: npm run build
        env:
          VITE_BASE: /interactive_DB_viewer/

      - name: Copy index.html to 404.html for SPA routing
        run: cp nir_lab/backend/static/index.html nir_lab/backend/static/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: nir_lab/backend/static
